name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:   # lanzar manualmente desde el celular

jobs:
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java 17 ──────────────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── Android SDK + NDK ────────────────────────────────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK r26 + build tools
        run: |
          sdkmanager --install \
            "ndk;26.1.10909125" \
            "build-tools;34.0.0" \
            "platforms;android-34"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125"         >> $GITHUB_ENV

      # ── Rust ─────────────────────────────────────────────────────
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Add Android targets (arm64 + arm32)
        run: |
          rustup target add aarch64-linux-android   # Moto Edge 50 Fusion
          rustup target add armv7-linux-androideabi  # compatibilidad arm32

      # ── Node / Frontend ──────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: tauri-frontend/package-lock.json

      - name: Install frontend deps
        run: cd tauri-frontend && npm ci

      - name: Build frontend
        run: cd tauri-frontend && npm run build

      # ── Tauri CLI ────────────────────────────────────────────────
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      # ── Init Android project ─────────────────────────────────────
      - name: Init Tauri Android project
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          cargo tauri android init || true

      # ── Build APK (release sin firmar) ───────────────────────────
      - name: Build Android APK
        run: |
          export JAVA_HOME=$JAVA_HOME_17_X64
          cargo tauri android build --apk
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME:         ${{ env.NDK_HOME }}

      # ── Firma del APK ────────────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/sourceseal.keystore

      - name: Sign APK with apksigner
        run: |
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/34.0.0"
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk"

          # Firmar todos los APKs encontrados
          find "$APK_DIR" -name "*.apk" | while read apk; do
            unsigned="${apk%.apk}-unsigned.apk"
            signed="${apk%.apk}-signed.apk"
            mv "$apk" "$unsigned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks /tmp/sourceseal.keystore \
              --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
              --ks-pass "pass:${{ secrets.STORE_PASSWORD }}" \
              --key-pass "pass:${{ secrets.KEY_PASSWORD }}" \
              --out "$signed" \
              "$unsigned"
            echo "✅ Firmado: $signed"
          done

          # Renombrar firmados para Release
          find "$APK_DIR" -name "*-signed.apk" -exec bash -c \
            'mv "$1" "${1/-signed/}"' _ {} \;

      # ── Número de versión ─────────────────────────────────────────
      - name: Get version
        id: version
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          echo "VERSION=$(date +'%Y.%m.%d')-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "TAG=v$(date +'%Y.%m.%d')-${SHORT_SHA}"    >> $GITHUB_OUTPUT

      # ── Publicar en GitHub Releases ──────────────────────────────
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.version.outputs.TAG }}"
          name: "SourceSeal Console ${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📱 SourceSeal Console — APK firmado

            ### Instalación en Moto Edge 50 Fusion (primera vez)
            1. Descarga el archivo `.apk` de abajo
            2. Abre el archivo desde el **gestor de archivos** del Moto
            3. Si aparece "Fuentes desconocidas" → **Ajustes → Permitir esta fuente**
            4. Instala → **Listo**

            ### Actualización sin desinstalar
            > El APK está firmado con el mismo keystore — Android instala
            > la actualización **encima** de la versión anterior, conservando todos los datos.
            1. Descarga el nuevo `.apk`
            2. Instala directamente — Android detecta la firma idéntica y actualiza

            ---
            **Commit:** `${{ github.sha }}`
            **Rama:** `${{ github.ref_name }}`
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Artifact de respaldo ─────────────────────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sourceseal-android-${{ steps.version.outputs.VERSION }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
