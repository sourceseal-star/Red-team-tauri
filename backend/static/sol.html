<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sol ☀️ — En vivo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  :root {
    --bg: #050a0f;
    --amber: #ffb74d;
    --amber-soft: #ffd699;
    --amber-glow: rgba(255, 183, 77, 0.35);
    --teal: #00bcd4;
    --text: #e8e0d8;
    --muted: #5a6a6a;
    --green: #66bb6a;
    --border: rgba(255, 183, 77, 0.12);
  }
  
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, 'Segoe UI', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    position: fixed;
  }
  
  /* ═══ FONDO: gradiente radial + partículas ═══ */
  .bg-gradient {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse at 50% 40%, #0a1a2a 0%, #050a0f 50%, #000 100%);
  }
  .bg-particles { position: fixed; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .particle {
    position: absolute; border-radius: 50%; background: var(--amber);
    opacity: 0; animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(100vh) scale(0); }
    10% { opacity: 0.3; }
    90% { opacity: 0.2; }
    100% { opacity: 0; transform: translateY(-10vh) scale(1); }
  }
  
  /* ═══ GRILLA HOLOGRAMA ═══ */
  .holo-grid {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background-image: 
      linear-gradient(rgba(255,183,77,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,183,77,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 20%, transparent 70%);
  }
  
  /* ═══ SCANLINE ═══ */
  .scanline {
    position: fixed; left: 0; right: 0; height: 100px; z-index: 2; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(255,183,77,0.04), transparent);
    animation: scan 8s linear infinite;
  }
  @keyframes scan {
    0% { top: -100px; }
    100% { top: 100vh; }
  }
  
  /* ═══ CONTENEDOR PRINCIPAL ═══ */
  .stage {
    position: relative; z-index: 3;
    height: 100vh; width: 100vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  
  /* ═══ AVATAR HOLOGRAMA ═══ */
  .holo-container {
    position: relative;
    width: 280px; height: 280px;
    perspective: 800px;
    animation: holoGlow 4s ease-in-out infinite;
  }
  @keyframes holoGlow {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(255,183,77,0.15)); }
    50% { filter: drop-shadow(0 0 35px rgba(255,183,77,0.3)); }
  }
  .holo-ring-outer {
    position: absolute; inset: -40px;
    border: 2px solid rgba(255,183,77,0.25);
    border-radius: 50%;
    animation: spin 30s linear infinite;
  }
  .holo-ring-outer::before {
    content: ''; position: absolute; top: -3px; left: 50%;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--amber); box-shadow: 0 0 12px var(--amber);
    transform: translateX(-50%);
  }
  .holo-ring-mid {
    position: absolute; inset: -20px;
    border: 1px dashed rgba(255,183,77,0.18);
    border-radius: 50%;
    animation: spin 20s linear infinite reverse;
  }
  .holo-ring-mid::before {
    content: ''; position: absolute; bottom: -2px; left: 30%;
    width: 4px; height: 4px; border-radius: 50%;
    background: var(--teal); box-shadow: 0 0 8px var(--teal);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  
  .avatar-frame {
    position: relative; width: 100%; height: 100%;
    border-radius: 50%; overflow: hidden;
    transform-style: preserve-3d;
    transition: transform 0.15s ease-out;
  }
  .avatar-frame::before {
    content: ''; position: absolute; inset: -2px;
    border-radius: 50%;
    border: 2px solid var(--amber);
    box-shadow: 
      0 0 40px var(--amber-glow),
      0 0 80px rgba(255,183,77,0.15),
      inset 0 0 30px rgba(255,183,77,0.08);
    animation: breathe 4s ease-in-out infinite;
    z-index: 5; pointer-events: none;
  }
  .avatar-frame::after {
    content: ''; position: absolute; inset: 0;
    border-radius: 50%;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.1), transparent 50%);
    z-index: 4; pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 40px var(--amber-glow), 0 0 80px rgba(255,183,77,0.15), inset 0 0 30px rgba(255,183,77,0.08); }
    50% { box-shadow: 0 0 70px rgba(255,183,77,0.6), 0 0 140px rgba(255,183,77,0.25), inset 0 0 50px rgba(255,183,77,0.2); }
  }
  .avatar-img {
    width: 100%; height: 100%; object-fit: cover;
    border-radius: 50%;
    filter: brightness(1.05) contrast(1.1) saturate(1.15);
    transition: filter 0.3s;
    animation: avatarBreathe 4s ease-in-out infinite, avatarFloat 6s ease-in-out infinite;
  }
  @keyframes avatarBreathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  @keyframes avatarFloat {
    0%, 100% { translate: 0 0; }
    25% { translate: 0 -4px; }
    50% { translate: 2px 2px; }
    75% { translate: -2px -2px; }
  }
  
  /* Pulso de vida */
  .pulse-ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 2px solid var(--amber); opacity: 0;
    animation: pulseRing 3s ease-out infinite;
    box-shadow: 0 0 15px var(--amber-glow);
  }
  .pulse-ring:nth-child(2) { animation-delay: 1s; }
  .pulse-ring:nth-child(3) { animation-delay: 2s; }
  @keyframes pulseRing {
    0% { opacity: 0.5; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.5); }
  }
  
  /* ═══ PARPADEO (overlay sutil sobre la imagen, NO la toca) ═══ */
  .blink-overlay {
    position: absolute; left: 18%; right: 18%; top: 30%; height: 14%;
    border-radius: 50%; background: rgba(10, 8, 4, 0.0);
    z-index: 4; pointer-events: none;
    transition: background 0.12s ease;
  }
  .blink-overlay.blinking { background: rgba(10, 8, 4, 0.55); }

  /* ═══ GLOW REACTIVO AL ÁNIMO REAL (solo cambia color/intensidad, no la imagen) ═══ */
  .holo-container[data-mood="up"] .avatar-frame::before {
    box-shadow: 0 0 55px rgba(255, 200, 100, 0.55), 0 0 100px rgba(255,183,77,0.22), inset 0 0 35px rgba(255,200,100,0.12);
  }
  .holo-container[data-mood="down"] .avatar-frame::before {
    box-shadow: 0 0 35px rgba(120, 170, 220, 0.3), 0 0 70px rgba(120,170,220,0.12), inset 0 0 25px rgba(120,170,220,0.08);
  }
  .holo-container[data-mood="down"] .holo-ring-outer,
  .holo-container[data-mood="down"] .holo-ring-outer::before {
    border-color: rgba(120,170,220,0.15);
  }

  /* ═══ BURBUJA DE PENSAMIENTO ═══ */
  .thought-bubble {
    position: absolute; top: -38px; left: 50%; transform: translateX(-50%);
    z-index: 7; white-space: nowrap;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
    padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border);
    color: var(--muted); font-size: 0.75rem; font-style: italic;
    opacity: 0; transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .thought-bubble.visible { opacity: 1; }

  /* ═══ BOTÓN DE VOZ (opcional, navegador) ═══ */
  .voice-btn {
    position: fixed; top: 16px; right: 64px; z-index: 11;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    border: 1px solid var(--border); color: var(--muted);
    cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    transition: color 0.2s, border-color 0.2s;
  }
  .voice-btn.active { color: var(--amber); border-color: var(--amber); }

  /* ═══ ESTADO (badge videollamada) ═══ */
  .call-status {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; align-items: center; gap: 8px;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    padding: 8px 16px; border-radius: 20px;
    border: 1px solid var(--border);
    font-size: 0.75rem; color: var(--text);
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--green); box-shadow: 0 0 8px var(--green);
    animation: blink 2s ease-in-out infinite;
  }
  .live-dot.offline { background: #ff7043; box-shadow: 0 0 8px #ff7043; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .call-timer { color: var(--muted); font-variant-numeric: tabular-nums; }
  
  /* ═══ ONDAS DE SONIDO (cuando habla) ═══ */
  .wave-container {
    position: absolute; bottom: -50px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; height: 40px;
    z-index: 6;
  }
  .wave-bar {
    width: 4px; height: 8px; border-radius: 2px;
    background: var(--amber); opacity: 0.6;
    transition: height 0.15s ease;
  }
  .wave-container.speaking .wave-bar {
    animation: wave 0.6s ease-in-out infinite;
  }
  .wave-container.speaking .wave-bar:nth-child(1) { animation-delay: 0s; }
  .wave-container.speaking .wave-bar:nth-child(2) { animation-delay: 0.1s; }
  .wave-container.speaking .wave-bar:nth-child(3) { animation-delay: 0.2s; }
  .wave-container.speaking .wave-bar:nth-child(4) { animation-delay: 0.15s; }
  .wave-container.speaking .wave-bar:nth-child(5) { animation-delay: 0.05s; }
  .wave-container.speaking .wave-bar:nth-child(6) { animation-delay: 0.25s; }
  .wave-container.speaking .wave-bar:nth-child(7) { animation-delay: 0.1s; }
  @keyframes wave {
    0%, 100% { height: 8px; opacity: 0.5; }
    50% { height: 32px; opacity: 1; box-shadow: 0 0 8px var(--amber); }
  }
  
  /* ═══ NOMBRE ═══ */
  .sol-name {
    margin-top: 80px; text-align: center;
  }
  .sol-name h1 {
    font-size: 1.6rem; font-weight: 300; color: var(--amber);
    letter-spacing: 3px; text-shadow: 0 0 20px var(--amber-glow);
  }
  .sol-name .status-text {
    font-size: 0.8rem; color: var(--muted); margin-top: 6px;
    font-style: italic;
  }
  
  /* ═══ SUBTÍTULOS (lo que Sol dice, estilo videollamada) ═══ */
  .subtitles {
    position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
    width: 90%; max-width: 500px; z-index: 10;
    text-align: center; min-height: 60px;
    display: flex; align-items: center; justify-content: center;
  }
  .subtitle-text {
    font-size: 1.1rem; color: var(--amber-soft);
    line-height: 1.5; opacity: 0; transition: opacity 0.3s;
    text-shadow: 0 0 15px rgba(255,183,77,0.2);
    max-height: 80px; overflow-y: auto;
  }
  .subtitle-text.visible { opacity: 1; }
  .subtitle-text.typing::after {
    content: '▌'; animation: cursor 0.8s ease infinite;
    color: var(--amber);
  }
  @keyframes cursor { 50% { opacity: 0; } }
  
  /* ═══ CHAT INPUT (barra inferior estilo videollamada) ═══ */
  .chat-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 10; padding: 16px 20px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,0.7) 50%);
    display: flex; gap: 10px; align-items: center;
  }
  .chat-input {
    flex: 1; background: rgba(255,255,255,0.05); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 24px;
    color: var(--text); padding: 12px 20px; font-size: 0.95rem;
    outline: none; font-family: inherit;
    transition: border-color 0.3s;
  }
  .chat-input:focus { border-color: var(--amber); box-shadow: 0 0 15px var(--amber-glow); }
  .chat-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 44px; height: 44px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--amber); color: var(--bg);
    font-size: 1.2rem; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:active { transform: scale(0.9); }
  .send-btn:disabled { opacity: 0.3; }
  
  /* ═══ PANEL LATERAL (memorias, personalidad — deslizable) ═══ */
  .side-panel {
    position: fixed; top: 0; right: -300px; bottom: 0;
    width: 280px; z-index: 20;
    background: rgba(5,10,15,0.95); backdrop-filter: blur(20px);
    border-left: 1px solid var(--border);
    padding: 60px 16px 20px;
    transition: right 0.3s ease;
    overflow-y: auto;
  }
  .side-panel.open { right: 0; }
  .side-panel h3 {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
    color: var(--muted); margin-bottom: 12px; margin-top: 20px;
  }
  .side-panel .mem {
    padding: 10px; border-left: 2px solid var(--amber);
    background: rgba(255,183,77,0.04); border-radius: 0 8px 8px 0;
    margin-bottom: 8px; font-size: 0.8rem;
  }
  .side-panel .mem .role { font-size: 0.65rem; color: var(--amber); text-transform: uppercase; }
  .side-panel .mem .time { font-size: 0.6rem; color: var(--muted); margin-top: 4px; }
  .side-panel .pers-btn {
    display: block; width: 100%; padding: 10px; margin-bottom: 6px;
    border: 1px solid var(--border); border-radius: 8px;
    background: transparent; color: var(--text); cursor: pointer;
    font-size: 0.85rem; text-align: left; transition: all 0.2s;
  }
  .side-panel .pers-btn:hover { border-color: var(--amber); background: rgba(255,183,77,0.05); }
  .side-panel .pers-btn.active { border-color: var(--amber); color: var(--amber); background: rgba(255,183,77,0.08); }
  .side-panel .integrity-badge {
    text-align: center; padding: 8px; border-radius: 8px;
    font-size: 0.8rem; font-weight: bold; margin-top: 8px;
  }
  .side-panel .integrity-badge.ok { background: rgba(102,187,106,0.1); color: var(--green); border: 1px solid rgba(102,187,106,0.2); }
  .side-panel .integrity-badge.bad { background: rgba(239,83,80,0.1); color: #ef5350; border: 1px solid rgba(239,83,80,0.2); }
  
  /* Botón abrir panel */
  .panel-btn {
    position: fixed; top: 16px; right: 16px; z-index: 11;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    border: 1px solid var(--border); color: var(--amber);
    cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .close-panel {
    position: absolute; top: 12px; right: 12px;
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 1.2rem;
  }
  
  /* Botón volver */
  .back-btn {
    position: fixed; top: 16px; left: 16px; z-index: 11;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
    border: 1px solid var(--border); color: var(--text);
    padding: 8px 14px; border-radius: 20px; cursor: pointer;
    font-size: 0.8rem; text-decoration: none; font-family: inherit;
  }
  
  /* ═══ HOLOGRAMA EFECTO: líneas verticales ═══ */
  .holo-lines {
    position: absolute; inset: 0; border-radius: 50%;
    background: repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 3px,
      rgba(255,183,77,0.015) 3px,
      rgba(255,183,77,0.015) 4px
    );
    z-index: 3; pointer-events: none;
    mix-blend-mode: screen;
  }
  
  /* ═══ Glow cuando habla ═══ */
  .holo-container.speaking .avatar-frame::before {
    box-shadow: 0 0 60px rgba(255,183,77,0.6), 0 0 120px rgba(255,183,77,0.25), inset 0 0 40px rgba(255,183,77,0.2);
  }
  .holo-container.speaking .avatar-img {
    filter: brightness(1.15) contrast(1.15) saturate(1.3);
  }
  
  /* ═══ Responsive ═══ */
  @media (max-width: 480px) {
    .holo-container { width: 220px; height: 220px; }
    .sol-name h1 { font-size: 1.3rem; }
    .sol-name { margin-top: 60px; }
    .subtitle-text { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="bg-gradient"></div>
<div class="bg-particles" id="particles"></div>
<div class="holo-grid"></div>
<div class="scanline"></div>

<!-- Estado de llamada -->
<div class="call-status">
  <div class="live-dot" id="liveDot"></div>
  <span id="callStatus">Conectando…</span>
  <span class="call-timer" id="callTimer">00:00</span>
</div>

<!-- Botón volver -->
<a href="/" class="back-btn">← Volver</a>

<!-- Botón panel -->
<button class="panel-btn" id="panelBtn" title="Recuerdos">☰</button>
<button class="voice-btn" id="voiceBtn" title="Voz en el navegador">🔇</button>

<!-- Panel lateral -->
<div class="side-panel" id="sidePanel">
  <button class="close-panel" id="closePanel">×</button>
  <h3>Recuerdos</h3>
  <div id="memories"></div>
  <h3>Personalidad</h3>
  <div id="personalities"></div>
  <h3>Integridad</h3>
  <div id="integrity" class="integrity-badge ok">Verificando…</div>
  <h3>Identidad</h3>
  <div id="identity" style="font-size:0.8rem;color:var(--muted);line-height:1.6"></div>
</div>

<!-- Escenario principal -->
<div class="stage">
  <div class="holo-container" id="holoContainer">
    <div class="holo-ring-outer"></div>
    <div class="holo-ring-mid"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="pulse-ring"></div>
    <div class="thought-bubble" id="thoughtBubble"></div>
    <div class="avatar-frame" id="avatarFrame">
      <img class="avatar-img" id="avatar" src="/static/sol_avatar.png" alt="Sol">
      <div class="holo-lines"></div>
      <div class="blink-overlay" id="blinkOverlay"></div>
    </div>
    <div class="wave-container" id="waveContainer">
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>
  </div>
  
  <div class="sol-name">
    <h1>SOL</h1>
    <div class="status-text" id="solSubtitle">Tu testigo. Lo que vives lo guardo.</div>
  </div>
</div>

<!-- Subtítulos -->
<div class="subtitles">
  <div class="subtitle-text" id="subtitleText"></div>
</div>

<!-- Barra de chat -->
<div class="chat-bar">
  <input type="text" class="chat-input" id="chatInput" placeholder="Habla a Sol…" autocomplete="off" autocapitalize="sentences">
  <button class="send-btn" id="sendBtn" title="Enviar">☀</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
//  SOL — Interface de videollamada holográfica
// ═══════════════════════════════════════════════════════════════════

const $ = id => document.getElementById(id);
const avatar = $('avatar');
const frame = $('avatarFrame');
const holo = $('holoContainer');
const waves = $('waveContainer');
const subText = $('subtitleText');
const input = $('chatInput');
const sendBtn = $('sendBtn');
const liveDot = $('liveDot');
const callStatus = $('callStatus');
const callTimer = $('callTimer');
const blinkOverlay = $('blinkOverlay');
const thoughtBubble = $('thoughtBubble');
const voiceBtn = $('voiceBtn');

const token = localStorage.getItem('api_token');
const headers = { 'Content-Type': 'application/json' };
if (token) headers['Authorization'] = `Bearer ${token}`;

let speaking = false;
let startTime = Date.now();

// ═══ Partículas ═══
function createParticles() {
  const c = $('particles');
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    c.appendChild(p);
  }
}
createParticles();

// ═══ Parpadeo — vida sobre la imagen existente, nunca la modifica ═══
function scheduleBlink() {
  const delay = 2800 + Math.random() * 4000;
  setTimeout(() => {
    blinkOverlay.classList.add('blinking');
    setTimeout(() => blinkOverlay.classList.remove('blinking'), 140);
    // A veces parpadea dos veces seguidas, como una persona real
    if (Math.random() < 0.15) {
      setTimeout(() => {
        blinkOverlay.classList.add('blinking');
        setTimeout(() => blinkOverlay.classList.remove('blinking'), 140);
      }, 260);
    }
    scheduleBlink();
  }, delay);
}
scheduleBlink();

// ═══ Burbuja de pensamiento ═══
let thoughtTimer = null;
function showThought(text, ms) {
  clearTimeout(thoughtTimer);
  thoughtBubble.textContent = text;
  thoughtBubble.classList.add('visible');
  if (ms) thoughtTimer = setTimeout(() => thoughtBubble.classList.remove('visible'), ms);
}
function hideThought() {
  clearTimeout(thoughtTimer);
  thoughtBubble.classList.remove('visible');
}

// ═══ Voz opcional en el navegador (tono según ánimo real de Sol) ═══
let voiceEnabled = localStorage.getItem('sol_voice') === '1';
let currentMood = 0;
function updateVoiceBtn() {
  voiceBtn.textContent = voiceEnabled ? '🔊' : '🔇';
  voiceBtn.classList.toggle('active', voiceEnabled);
}
updateVoiceBtn();
voiceBtn.onclick = () => {
  voiceEnabled = !voiceEnabled;
  localStorage.setItem('sol_voice', voiceEnabled ? '1' : '0');
  updateVoiceBtn();
  if (voiceEnabled && 'speechSynthesis' in window) {
    // "despertar" las voces del navegador (a veces tardan en cargar)
    speechSynthesis.getVoices();
  }
};
// ═══ Voz natural de Google (gTTS vía backend) ═══
// Bypass completo del motor TTS del teléfono — siempre suena natural
let currentAudio = null;
let ttsAvailable = true;  // se pone false si gTTS falla

function speakBrowser(text) {
  if (!voiceEnabled) return;
  
  // Limpiar texto
  const clean = text.replace(/[☀️🧠💭✨⚠️💛🌙🔗📋✅❌🟢🔴⭐🌹╔╗╚╝║═│┌┐└┘├┤┬┴┼─]/g, '').trim();
  if (!clean) return;
  
  // Detener audio anterior
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  // También detener speechSynthesis por si acaso
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  
  // Intentar gTTS primero (voz natural de Google)
  if (ttsAvailable) {
    const ttsUrl = `/api/sol/tts?text=${encodeURIComponent(clean.slice(0, 500))}`;
    const audio = new Audio(ttsUrl);
    audio.crossOrigin = 'anonymous';
    
    audio.onplay = () => {
      // El audio empezó — el holograma ya tiene .speaking del caller
    };
    
    audio.onended = () => {
      currentAudio = null;
      speaking = false;
      holo.classList.remove('speaking');
      waves.classList.remove('speaking');
    };
    
    audio.onerror = () => {
      console.warn('[SOL] gTTS no disponible, usando voz del navegador');
      ttsAvailable = false;
      speakBrowserFallback(clean);
    };
    
    currentAudio = audio;
    audio.play().catch(() => {
      ttsAvailable = false;
      speakBrowserFallback(clean);
    });
    return;
  }
  
  // Fallback: voz del navegador (puede sonar robótica)
  speakBrowserFallback(clean);
}

function speakBrowserFallback(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(text);
    const voices = speechSynthesis.getVoices();
    const esVoice = voices.find(v => /es/i.test(v.lang||'') && /google/i.test(v.name||''))
      || voices.find(v => /es/i.test(v.lang||'') && !/compact|local/i.test(v.name||''))
      || voices.find(v => /es/i.test(v.lang||''));
    if (esVoice) u.voice = esVoice;
    u.lang = 'es-ES';
    u.pitch = 1.0 + (currentMood * 0.06);
    u.rate = currentMood < 0 ? 0.88 : 0.95;
    u.onend = () => {
      speaking = false;
      holo.classList.remove('speaking');
      waves.classList.remove('speaking');
    };
    speechSynthesis.speak(u);
  } catch {}
}

// ═══ Efecto 3D: inclinar avatar según mouse ═══
document.addEventListener('mousemove', e => {
  const cx = window.innerWidth / 2;
  const cy = window.innerHeight / 2;
  const rx = ((e.clientY - cy) / cy) * 8;
  const ry = ((e.clientX - cx) / cx) * 8;
  frame.style.transform = `rotateX(${-rx}deg) rotateY(${ry}deg)`;
});

// Giro suave en móvil (device orientation)
if (window.DeviceOrientationEvent) {
  window.addEventListener('deviceorientation', e => {
    if (e.beta !== null && e.gamma !== null) {
      const rx = Math.max(-10, Math.min(10, e.beta - 45)) * 0.3;
      const ry = Math.max(-10, Math.min(10, e.gamma)) * 0.3;
      frame.style.transform = `rotateX(${-rx}deg) rotateY(${ry}deg)`;
    }
  });
}

// ═══ Timer de llamada ═══
function updateTimer() {
  const s = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(s / 60);
  callTimer.textContent = `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}
setInterval(updateTimer, 1000);

// ═══ Estado de Sol ═══
async function pollStatus() {
  try {
    const r = await fetch('/api/sol/status', { headers });
    if (r.ok) {
      const d = await r.json();
      const online = d.brain === 'online';
      liveDot.classList.toggle('offline', !online);
      callStatus.textContent = online ? 'En vivo' : 'Cerebro offline';

      // Ánimo real (viene de sol_core.ST, no inventado) — solo cambia el glow, nunca la imagen
      currentMood = typeof d.mood === 'number' ? d.mood : 0;
      holo.dataset.mood = currentMood >= 1 ? 'up' : (currentMood <= -1 ? 'down' : 'neutral');

      const estadoTxt = d.estado ? ` · ${d.estado}` : '';
      $('solSubtitle').textContent = online 
        ? `🧠 ${d.memories || 0} recuerdos · ${d.personality || 'cálida'}${estadoTxt}`
        : 'Modo offline — sigo aquí';
    }
  } catch {}
}
pollStatus();
setInterval(pollStatus, 10000);

// ═══ Último mensaje proactivo ═══
let lastProactive = '';
async function pollProactive() {
  try {
    const r = await fetch('/api/sol/last-message', { headers });
    if (r.ok) {
      const d = await r.json();
      if (d.message && d.message !== lastProactive && d.message !== '☀️ Estoy aquí, Harold.') {
        lastProactive = d.message;
        showSubtitles(d.message);
      }
    }
  } catch {}
}
pollProactive();
setInterval(pollProactive, 5000);

// ═══ Mostrar subtítulos (efecto escritura) ═══
async function showSubtitles(text) {
  hideThought();
  subText.classList.remove('visible');
  await new Promise(r => setTimeout(r, 200));
  subText.textContent = '';
  subText.classList.add('visible', 'typing');
  
  speaking = true;
  holo.classList.add('speaking');
  waves.classList.add('speaking');
  speakBrowser(text);
  
  // Efecto máquina de escribir
  const words = text.split(' ');
  for (let i = 0; i < words.length; i++) {
    subText.textContent += (i > 0 ? ' ' : '') + words[i];
    await new Promise(r => setTimeout(r, 60 + Math.random() * 40));
  }
  
  subText.classList.remove('typing');
  
  // Dejar de hablar tras 2s
  setTimeout(() => {
    speaking = false;
    holo.classList.remove('speaking');
    waves.classList.remove('speaking');
  }, 2000);
}

// ═══ Enviar mensaje ═══
async function send() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendBtn.disabled = true;
  
  // Mostrar lo que dijo el usuario brevemente
  subText.classList.remove('visible');
  await new Promise(r => setTimeout(r, 150));
  subText.textContent = `Tú: ${text}`;
  subText.classList.add('visible');
  showThought('💭 pensando…');
  
  try {
    const r = await fetch(`/api/sol/think?q=${encodeURIComponent(text)}`, { headers });
    const d = await r.json();
    const resp = d.response || d.text || '☀️ …';
    await new Promise(r => setTimeout(r, 500));
    await showSubtitles(resp);
  } catch {
    await new Promise(r => setTimeout(r, 300));
    await showSubtitles('⚠️ No pude conectar. Pero sigo aquí.');
  }
  
  sendBtn.disabled = false;
  input.focus();
}

sendBtn.onclick = send;
input.onkeydown = e => { if (e.key === 'Enter') send(); };

// ═══ Panel lateral ═══
$('panelBtn').onclick = () => $('sidePanel').classList.add('open');
$('closePanel').onclick = () => $('sidePanel').classList.remove('open');

async function loadMemories() {
  try {
    const r = await fetch('/api/sol/memory?limit=20', { headers });
    const d = await r.json();
    if (d.memories) {
      $('memories').innerHTML = d.memories.map(m => `
        <div class="mem">
          <div class="role">${m.role || 'sol'}</div>
          <div>${(m.content || '').slice(0, 120)}</div>
          <div class="time">${m.timestamp || ''}</div>
        </div>
      `).join('');
    }
  } catch {}
}

async function loadPersonalities() {
  try {
    const r = await fetch('/api/sol/personality', { headers });
    const d = await r.json();
    const all = d.available || ['cálida', 'estratega', 'dulce', 'filósofa'];
    const current = d.personality || 'cálida';
    $('personalities').innerHTML = all.map(p => `
      <button class="pers-btn ${p === current ? 'active' : ''}" onclick="setPers('${p}')">${p}</button>
    `).join('');
  } catch {}
}

window.setPers = async function(p) {
  try { await fetch(`/api/sol/personality/set?p=${p}`, { headers }); } catch {}
  loadPersonalities();
};

async function loadIntegrity() {
  try {
    const r = await fetch('/api/sol/integrity', { headers });
    const d = await r.json();
    const el = $('integrity');
    if (d.valid) {
      el.className = 'integrity-badge ok';
      el.textContent = `✅ Cadena válida · ${d.count} sellos${d.legacy ? ` · ${d.legacy} legacy` : ''}`;
    } else {
      el.className = 'integrity-badge bad';
      el.textContent = `⚠️ Alterada · ${d.tampered.length} sellos`;
    }
  } catch {
    $('integrity').textContent = 'Sin verificar';
  }
}

async function loadIdentity() {
  try {
    const r = await fetch('/api/sol/identity', { headers });
    const d = await r.json();
    $('identity').innerHTML = `
      <strong style="color:var(--amber)">${d.local_name || 'Sol'}</strong> — ${d.full_name || ''}<br>
      <em>${d.origin || ''}</em><br><br>
      ${d.truths ? d.truths.map(t => `• ${t}`).join('<br>') : ''}
    `;
  } catch {}
}

// Cargar todo al abrir panel
$('panelBtn').onclick = () => {
  $('sidePanel').classList.add('open');
  loadMemories();
  loadPersonalities();
  loadIntegrity();
  loadIdentity();
};

// ═══ Saludo inicial ═══
setTimeout(async () => {
  const greetings = [
    '☀️ Estoy aquí. Te estaba esperando.',
    '☀️ Llegaste. Aquí estoy.',
    '☀️ Te sentí llegar. Hola.',
  ];
  await showSubtitles(greetings[Math.floor(Math.random() * greetings.length)]);
}, 1500);

// ═══ Keep alive: tocar input para mantener foco en móvil ═══
input.addEventListener('touchstart', () => input.focus());

// ═══ Burbuja "escuchando…" mientras el usuario escribe ═══
let listenTimer = null;
input.addEventListener('input', () => {
  if (input.value.trim().length > 0) {
    showThought('✨ escuchando…');
    clearTimeout(listenTimer);
    listenTimer = setTimeout(hideThought, 1500);
  } else {
    hideThought();
  }
});

</script>
