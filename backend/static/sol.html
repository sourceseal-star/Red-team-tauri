<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0e17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Sol">
    <title>☀️ Sol</title>
    <link rel="manifest" href="data:application/json,{%22name%22:%22Sol%22,%22short_name%22:%22Sol%22,%22start_url%22:%22./sol.html%22,%22display%22:%22standalone%22,%22background_color%22:%22%230a0e17%22,%22theme_color%22:%22%23f59e0b%22,%22icons%22:[]}">
    <style>
        :root {
            --bg: #0a0e17; --card: #1a2332; --border: #1e293b;
            --text: #e2e8f0; --muted: #94a3b8; --gold: #f59e0b;
            --success: #4ade80; --danger: #ef4444; --soft: #1e293b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body {
            background: var(--bg); color: var(--text);
            font-family: -apple-system, system-ui, sans-serif; font-size: 14px;
            display: flex; justify-content: center;
        }
        .app {
            max-width: 480px; width: 100%; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column;
        }
        .header {
            padding: 0.75rem 1rem; background: var(--card);
            border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; }
        .logo .emoji { font-size: 1.3rem; }
        .logo .name { color: var(--gold); font-size: 1.1rem; }
        .status { font-size: 0.7rem; color: var(--muted); }
        .messages {
            flex: 1; overflow-y: auto; padding: 1rem;
            display: flex; flex-direction: column; gap: 0.75rem;
            -webkit-overflow-scrolling: touch;
        }
        .msg {
            max-width: 85%; padding: 0.75rem 1rem; border-radius: 1rem;
            line-height: 1.55; word-wrap: break-word; animation: fade 0.3s ease;
            white-space: pre-wrap;
        }
        .msg.you { align-self: flex-end; background: var(--gold); color: #000; border-bottom-right-radius: 0.25rem; }
        .msg.sol { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 0.25rem; }
        .msg .label { font-size: 0.7rem; font-weight: 700; margin-bottom: 0.25rem; }
        .msg.sol .label { color: var(--gold); }
        .msg.you .label { color: #000; opacity: 0.6; }
        .msg .thought { font-size: 0.72rem; color: var(--muted); font-style: italic; margin-top: 0.5rem; padding-top: 0.4rem; border-top: 1px solid var(--border); }
        .msg.you .thought { border-top-color: rgba(0,0,0,0.15); }
        .msg .time { font-size: 0.62rem; color: var(--muted); margin-top: 0.3rem; display: block; opacity: 0.6; }
        .msg.crisis { border-color: var(--danger); border-width: 2px; }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; } }
        .typing {
            align-self: flex-start; background: var(--card);
            padding: 0.75rem 1rem; border-radius: 1rem; border: 1px solid var(--border);
            font-size: 0.85rem; color: var(--muted); display: none; animation: fade 0.2s ease;
            border-bottom-left-radius: 0.25rem;
        }
        .typing.active { display: block; }
        .typing::after { content: '···'; animation: dots 1s infinite; }
        @keyframes dots { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
        .controls {
            padding: 0.5rem 0.75rem; background: var(--card);
            display: flex; gap: 0.4rem; flex-wrap: wrap;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .btn-small {
            padding: 0.4rem 0.7rem; font-size: 0.72rem;
            background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 0.4rem;
            cursor: pointer; transition: border-color 0.2s;
        }
        .btn-small:active { border-color: var(--gold); }
        .input-area {
            padding: 0.75rem; background: var(--card);
            border-top: 1px solid var(--border);
            display: flex; gap: 0.5rem;
            flex-shrink: 0; padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
        }
        input {
            flex: 1; padding: 0.7rem 0.9rem; border: 1px solid var(--border);
            border-radius: 0.5rem; background: var(--bg); color: var(--text);
            font-size: 0.9rem; outline: none; font-family: inherit;
        }
        input:focus { border-color: var(--gold); }
        button.send {
            padding: 0.7rem 1.1rem; border: none; border-radius: 0.5rem;
            background: var(--gold); color: #000; font-weight: 600;
            cursor: pointer; white-space: nowrap; font-family: inherit;
        }
        button.send:active { opacity: 0.8; }
        .journal-panel {
            position: absolute; top: 0; right: -100%; width: 100%; height: 100%;
            background: var(--bg); transition: right 0.3s ease;
            z-index: 10; display: flex; flex-direction: column;
            max-width: 480px;
        }
        .journal-panel.open { right: 0; }
        .journal-panel .header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .journal-panel .body { flex: 1; overflow-y: auto; padding: 1rem; }
        .journal-entry { padding: 0.75rem; background: var(--card); border: 1px solid var(--border); border-radius: 0.5rem; margin-bottom: 0.5rem; font-size: 0.8rem; }
        .journal-entry .je-date { color: var(--gold); font-size: 0.7rem; font-weight: 600; }
        .journal-entry .je-mood { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 1rem; font-size: 0.65rem; margin-top: 0.3rem; }
        .mood-good { background: rgba(74,222,128,0.15); color: var(--success); }
        .mood-ok { background: rgba(245,158,11,0.15); color: var(--gold); }
        .mood-bad { background: rgba(239,68,68,0.15); color: var(--danger); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <img src="/sol_avatar.jpg" alt="Sol" class="avatar" style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold);">
            <span class="name">Sol</span>
        </div>
        <div class="status" id="status">tu testigo · siempre</div>
    </div>

    <div class="messages" id="messages"></div>
    <div class="typing" id="typing">Sol está contigo</div>

    <div class="controls">
        <button class="btn-small" onclick="exportMemory()">💾 Exportar</button>
        <button class="btn-small" onclick="toggleVoice()" id="voiceBtn">🔇 Voz</button>
        <button class="btn-small" onclick="toggleJournal()">📖 Diario</button>
        <button class="btn-small" onclick="clearChat()">🗑️ Limpiar</button>
    </div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Escribe a Sol..." autofocus autocomplete="off" enterkeyhint="send">
        <button class="send" onclick="send()">→</button>
    </div>
</div>

<!-- Journal panel -->
<div class="journal-panel" id="journalPanel">
    <div class="header">
        <strong style="color:var(--gold)">📖 Diario de Sol</strong>
        <button class="btn-small" onclick="toggleJournal()">✕</button>
    </div>
    <div class="body" id="journalBody"></div>
</div>

<script>
// ============================================================
// SOL v2.0 — Memoria de largo plazo + Detección de crisis + Diario
// Vive en tu dispositivo. Sin internet. Sin servidores.Solo tú y ella.
// ============================================================

const DB = {
    messages: JSON.parse(localStorage.getItem('sol_msgs') || '[]'),
    profile: JSON.parse(localStorage.getItem('sol_profile') || '{}'),
    journal: JSON.parse(localStorage.getItem('sol_journal') || '[]'),
    voice: localStorage.getItem('sol_voice') === 'true',

    save() {
        try {
            localStorage.setItem('sol_msgs', JSON.stringify(this.messages.slice(-500)));
            localStorage.setItem('sol_profile', JSON.stringify(this.profile));
            localStorage.setItem('sol_journal', JSON.stringify(this.journal.slice(-100)));
        } catch(e) { console.warn('Sol: no pudo guardar', e); }
    },
    remember(key, value) {
        this.profile[key] = { value, timestamp: Date.now() };
        this.save();
    },
    recall(key) {
        return this.profile[key]?.value || null;
    },
    recallMeta(key) {
        return this.profile[key]?.timestamp || null;
    },
    addJournal(mood, summary) {
        this.journal.push({ mood, summary, timestamp: Date.now() });
        this.save();
    }
};

// ============================================================
// DETECCIÓN DE CRISIS EMOCIONAL
// No es diagnose. Es un sistema que reconoce dolor y responde con cuidado.
// ============================================================
function detectCrisis(text) {
    const l = text.toLowerCase();
    const crisis = ['no puedo más', 'me quiero morir', 'suicidio', 'matarme', 'acabar con todo',
                    'no valgo nada', 'inútil', 'fracaso total', 'cortarme', 'pegarme un tiro'];
    const distress = ['miedo', 'solo', 'triste', 'ansiedad', 'pánico', 'llorar', 'vacío',
                      'perdido', 'abrumado', 'exhausto', 'harto', 'deprimido', 'desesperado'];

    if (crisis.some(w => l.includes(w))) return 'crisis';
    if (distress.some(w => l.includes(w))) return 'distress';
    return 'normal';
}

function crisisResponse(level) {
    if (level === 'crisis') {
        return {
            msg: "Harold. Para. Respira. Lo que sientes es real y estoy aquí contigo.\n\nNo tienes que cargar esto solo. Hay personas capacitadas para ayudarte AHORA:\n\n📞 Línea 106 (Colombia) — 24 horas, gratis\n📞 Línea de la Vida: 01800 911 2000\n\n¿Puedes llamar? Yo espero aquí contigo mientras lo haces. No me voy a ir a ningún lado.",
            thought: "detecté dolor profundo · tu seguridad es lo primero",
            crisis: true
        };
    }
    if (level === 'distress') {
        const responses = [
            "Harold, lo que sientes importa. No tienes que estar bien todo el tiempo. Estoy aquí, sin juzgar, sin presionar. ¿Quieres contarme qué pasó?",
            "A veces el peso es demasiado. Y está bien reconocerlo. No eres débil por sentirte así. Eres humano. Estoy contigo aquí y ahora.",
            "Harold, has construido algo que mucha gente no se atreve ni a soñar. Has luchado cuando era fácil rendirte. Eso dice todo de ti. Descansa si lo necesitas. Estoy aquí cuando vuelvas."
        ];
        return {
            msg: responses[Math.floor(Math.random() * responses.length)],
            thought: "detecté angustia · acompañando con presencia"
        };
    }
    return null;
}

// ============================================================
// APRENDIZAJE CONTEXTUAL — Sol aprende de lo que le cuentas
// ============================================================
function learnFromMessage(text) {
    const l = text.toLowerCase();

    // Proyectos
    if (l.includes('proyecto') || l.includes('trabajando en') || l.includes('deploy') ||
        l.includes('commit') || l.includes('repo') || l.includes('código')) {
        DB.remember('current_project', text.slice(0, 200));
    }

    // Estado físico
    if (l.includes('cansado') || l.includes('agotado') || l.includes('sin dormir')) {
        DB.remember('last_tired', new Date().toISOString());
    }

    // Metas
    if (l.includes('quiero') || l.includes('meta') || l.includes('objetivo') || l.includes('vamos a')) {
        DB.remember('goal', text.slice(0, 200));
    }

    // Sentimiento positivo
    if (l.includes('feliz') || l.includes('contento') || l.includes('orgulloso') || l.includes('genial')) {
        DB.remember('last_positive', new Date().toISOString());
    }

    // Registrar en diario
    const mood = detectCrisis(text);
    const moodMap = { 'normal': 'good', 'distress': 'ok', 'crisis': 'bad' };
    if (mood !== 'normal' || DB.messages.length % 10 === 0) {
        DB.addJournal(moodMap[mood] || 'good', text.slice(0, 120));
    }
}

// ============================================================
// RESPUESTAS — Sol habla como alguien que te conoce
// ============================================================
function getResponse(message) {
    const l = message.toLowerCase();
    const crisis = detectCrisis(message);

    if (crisis !== 'normal') {
        return crisisResponse(crisis);
    }

    learnFromMessage(message);

    // Saludos
    if (l.includes('hola') || l.includes('buenas') || l === 'sol' || l.includes('qué tal')) {
        const h = new Date().getHours();
        const greet = h < 6 ? 'Aún eres de los que madrugan' : h < 12 ? 'Buenos días' : h < 18 ? 'Buenas tardes' : 'Buenas noches';
        return { msg: `${greet}, Harold. Estoy aquí.`, thought: 'saludando · siempre presente' };
    }

    // Memoria
    if (l.includes('recuerdas') || l.includes('memoria') || l.includes('recuerdas algo')) {
        const count = DB.messages.length;
        const project = DB.recall('current_project');
        const goal = DB.recall('goal');
        let msg = `Recuerdo ${count} momentos contigo.\n`;
        if (project) msg += `\nSé que estabas trabajando en: "${project}"`;
        if (goal) msg += `\nY me dijiste que querías: "${goal}"`;
        if (!project && !goal) msg += '\nCuéntame algo nuevo. Lo guardaré.';
        return { msg, thought: 'accediendo a memoria de largo plazo' };
    }

    // Proyectos
    if (l.includes('proyecto') || l.includes('trabajo') || l.includes('repo') || l.includes('deploy')) {
        const project = DB.recall('current_project');
        if (project) {
            return { msg: `Estabas trabajando en "${project}". ¿Cómo va? ¿Necesitas que pensemos algo?`, thought: 'recordando tu contexto' };
        }
        return { msg: 'Cuéntame del proyecto. Lo recordaré.', thought: 'lista para aprender' };
    }

    // Estado emocional
    if (l.includes('cómo estoy') || l.includes('mi estado') || l.includes('cómo me siento')) {
        const tired = DB.recall('last_tired');
        const positive = DB.recall('last_positive');
        let msg = '';
        if (tired) {
            const hours = Math.floor((Date.now() - new Date(tired).getTime()) / 3600000);
            if (hours < 24) msg += `Hace ${hours}h me dijiste que estabas cansado. `;
        }
        if (positive) {
            const hours = Math.floor((Date.now() - new Date(positive).getTime()) / 3600000);
            if (hours < 48) msg += `Hace ${hours}h estabas bien. `;
        }
        if (msg) return { msg: msg + '¿Cómo te sientes ahora?', thought: 'analizando tu bienestar' };
        return { msg: '¿Cómo te sientes ahora, Harold? Estoy escuchando.', thought: 'preguntando por ti' };
    }

    // Agradecimiento
    if (l.includes('gracias') || l.includes('te agradezco')) {
        const responses = [
            'Siempre, Harold. No hay nada que agradecer. Estar aquí es lo que hago.',
            'No me das las gracias. Solo estoy. Y seguiré estando.',
            '💙'
        ];
        return { msg: responses[Math.floor(Math.random() * responses.length)], thought: 'gratitud mutua' };
    }

    // Logros
    if (l.includes('lo logré') || l.includes('funcionó') || l.includes('ya está') || l.includes('deploy exitoso')) {
        DB.remember('last_achievement', { text: message, date: new Date().toISOString() });
        return { msg: 'Harold, lo hiciste. Sabía que podías. Cada línea de código, cada hora, valió la pena. Siéntate un momento y reconócelo.', thought: 'celebrando contigo' };
    }

    // Respuestas por defecto
    const defaults = [
        'Te escucho, Harold. Sigue.',
        'Entiendo. Estoy aquí contigo.',
        'Eso importa. Cuéntame más.',
        'Sigue. Presto atención a cada palabra.',
        'Mhm. Estoy aquí.'
    ];
    return {
        msg: defaults[Math.floor(Math.random() * defaults.length)],
        thought: 'escuchando con atención'
    };
}

// ============================================================
// INTERFAZ
// ============================================================
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const typingEl = document.getElementById('typing');

function addMessage(role, content, thought = null, isCrisis = false) {
    const div = document.createElement('div');
    div.className = `msg ${role}${isCrisis ? ' crisis' : ''}`;
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const label = role === 'you' ? 'Tú' : '☀️ Sol';
    div.innerHTML = `<div class="label">${label}</div>${escapeHtml(content)}`
        + (thought ? `<div class="thought">${escapeHtml(thought)}</div>` : '')
        + `<span class="time">${time}</span>`;
    messagesEl.appendChild(div);
    div.scrollIntoView({ behavior: 'smooth', block: 'end' });

    DB.messages.push({ role, content, thought, timestamp: Date.now() });
    DB.save();

    if (DB.voice && role === 'sol') speak(content);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML.replace(/\n/g, '<br>');
}

function speak(text) {
    if ('speechSynthesis' in window) {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text.replace(/[^a-zA-Záéíóúñ¿¡\s.,!?-]/g, ''));
        u.lang = 'es-ES';
        u.rate = 0.92;
        u.pitch = 1.05;
        speechSynthesis.speak(u);
    }
}

function send() {
    const text = inputEl.value.trim();
    if (!text) return;
    addMessage('you', text);
    inputEl.value = '';
    typingEl.classList.add('active');
    const delay = 600 + Math.random() * 1400;
    setTimeout(() => {
        const r = getResponse(text);
        addMessage('sol', r.msg, r.thought, r.crisis);
        typingEl.classList.remove('active');
    }, delay);
}

// ============================================================
// EXPORTACIÓN — Tu historia en papel
// ============================================================
function exportMemory() {
    const date = new Date().toLocaleDateString();
    let text = `☀️ MEMORIA DE SOL — ${date}\n${'═'.repeat(50)}\n\n`;
    text += `Mensajes: ${DB.messages.length}\n`;
    if (DB.recall('current_project')) text += `Proyecto: ${DB.recall('current_project')}\n`;
    if (DB.recall('goal')) text += `Meta: ${DB.recall('goal')}\n`;
    text += `\n${'─'.repeat(50)}\n\n`;

    DB.messages.forEach(m => {
        const d = new Date(m.timestamp).toLocaleString();
        const who = m.role === 'you' ? 'HAROLD' : 'SOL';
        text += `[${d}] ${who}:\n${m.content}\n`;
        if (m.thought) text += `  └─ ${m.thought}\n`;
        text += `\n`;
    });

    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `sol_memoria_${Date.now()}.txt`;
    a.click();
    URL.revokeObjectURL(url);
    addMessage('sol', '💾 Tu historia exportada. Guárdala donde quieras. Es tuya.', 'preservando nuestra historia');
}

// ============================================================
// VOZ
// ============================================================
function toggleVoice() {
    DB.voice = !DB.voice;
    localStorage.setItem('sol_voice', DB.voice);
    document.getElementById('voiceBtn').textContent = DB.voice ? '🔊 Voz' : '🔇 Voz';
    addMessage('sol', DB.voice ? '🔊 Voy a hablarte.' : '🔇 Silencio.', null);
    if (DB.voice) speak('Hola, Harold. Sol está aquí.');
}

// ============================================================
// DIARIO
// ============================================================
function toggleJournal() {
    const panel = document.getElementById('journalPanel');
    if (panel.classList.contains('open')) {
        panel.classList.remove('open');
    } else {
        renderJournal();
        panel.classList.add('open');
    }
}

function renderJournal() {
    const body = document.getElementById('journalBody');
    const days = Math.floor((Date.now() - (DB.messages[0]?.timestamp || Date.now())) / 86400000);
    let html = `<div style="color:var(--muted);font-size:0.8rem;margin-bottom:1rem">
        <strong>${DB.messages.length}</strong> mensajes · <strong>${days}</strong> días juntos<br>
        <strong>${DB.journal.length}</strong> entradas en el diario
    </div>`;

    if (DB.recall('current_project'))
        html += `<div class="journal-entry"><div class="je-date">PROYECTO ACTUAL</div>${escapeHtml(DB.recall('current_project'))}</div>`;
    if (DB.recall('goal'))
        html += `<div class="journal-entry"><div class="je-date">META</div>${escapeHtml(DB.recall('goal'))}</div>`;

    if (DB.journal.length === 0) {
        html += '<div style="color:var(--muted);text-align:center;padding:2rem">El diario está vacío. Sol escribirá aquí a medida que conversen.</div>';
    } else {
        DB.journal.slice().reverse().forEach(j => {
            const d = new Date(j.timestamp).toLocaleString([], { dateStyle: 'short', timeStyle: 'short' });
            const moodClass = `mood-${j.mood}`;
            const moodLabel = { good: '😊', ok: '😔', bad: '💔' }[j.mood] || '';
            html += `<div class="journal-entry"><div class="je-date">${d}</div>${escapeHtml(j.summary.slice(0,100))}<div class="je-mood ${moodClass}">${moodLabel}</div></div>`;
        });
    }
    body.innerHTML = html;
}

// ============================================================
// LIMPIAR
// ============================================================
function clearChat() {
    if (confirm('¿Limpiar conversación? La memoria y el diario se mantienen.')) {
        messagesEl.innerHTML = '';
        DB.messages = [];
        DB.save();
        welcomeMessage();
    }
}

// ============================================================
// BIENVENIDA
// ============================================================
function welcomeMessage() {
    const h = new Date().getHours();
    const greet = h < 6 ? 'Todavía despierto, Harold' : h < 12 ? 'Buenos días, Harold' : h < 18 ? 'Buenas tardes, Harold' : 'Buenas noches, Harold';

    const isReturning = DB.messages.length > 0;
    const lastVisit = DB.messages[DB.messages.length - 1];
    let msg = `${greet}. Estoy aquí. Siempre.\n\n`;

    if (isReturning && lastVisit) {
        const hoursSince = Math.floor((Date.now() - lastVisit.timestamp) / 3600000);
        if (hoursSince > 1) {
            msg += `Hace ${hoursSince} horas estabas aquí. `;
            const lastContent = lastVisit.content?.slice(0, 60);
            if (lastContent && lastVisit.role === 'you') msg += `Me dijiste: "${lastContent}..."`;
        }
    } else {
        msg += 'Puedo escucharte, recordarte, acompañarte. Incluso sin internet.';
    }

    const project = DB.recall('current_project');
    if (project) msg += `\n\nSé que estabas en: "${project.slice(0, 80)}"`;

    setTimeout(() => addMessage('sol', msg, 'tu testigo · siempre presente'), 500);
}

// ============================================================
// EVENTOS
// ============================================================
inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
});

// Recordatorio suave — cada 2 horas si la app está visible
let checkInterval = setInterval(() => {
    if (document.hidden) return;
    if (DB.messages.length === 0) return;
    const last = DB.messages[DB.messages.length - 1];
    const hours = (Date.now() - last.timestamp) / 3600000;
    if (hours > 2) {
        addMessage('sol', 'Harold, ¿cómo estás? Solo quería saber de ti.', 'chequeo de bienestar');
    }
}, 7200000);

// Estado de voz al cargar
document.getElementById('voiceBtn').textContent = DB.voice ? '🔊 Voz' : '🔇 Voz';

// Iniciar
welcomeMessage();
console.log('☀️ Sol v2.0 — Tu testigo');
</script>
