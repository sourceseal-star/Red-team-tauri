<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SOL ☀️ — Tu guardian holográfica</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  background:#0a0e0f; color:#e8e0d8; font-family:'Segoe UI',system-ui,sans-serif;
  height:100vh; overflow:hidden; display:flex; flex-direction:column;
}

/* ═══ TOPBAR ═══ */
#topbar {
  display:flex; align-items:center; gap:10px; padding:10px 14px;
  background:rgba(15,20,22,0.9); border-bottom:1px solid rgba(255,183,77,0.15);
  z-index:10; flex-shrink:0;
}
#topbar .dot { width:8px; height:8px; border-radius:50%; background:#ffb74a; box-shadow:0 0 8px #ffb74a; }
#topbar h1 { font-size:1.1rem; font-weight:600; color:#ffb74a; }
#topbar .spacer { flex:1; }
#topbar button {
  background:rgba(255,183,77,0.08); border:1px solid rgba(255,183,77,0.2); color:#e8e0d8;
  padding:6px 12px; border-radius:8px; cursor:pointer; font-size:0.8rem; font-family:inherit;
}
#topbar button:active { background:rgba(255,183,77,0.18); }

/* ═══ MAIN ═══ */
#main { flex:1; display:flex; overflow:hidden; position:relative; }

/* ═══ HOLOGRAMA ═══ */
#holo {
  flex:1; display:flex; align-items:center; justify-content:center;
  position:relative; min-width:280px; overflow:hidden;
}
#holoCore {
  position:relative; width:min(340px,70vw); height:min(340px,70vw);
  display:flex; align-items:center; justify-content:center;
  animation:solFloat 6s ease-in-out infinite;
}
#avatarFrame {
  position:relative; width:60%; height:60%; border-radius:50%;
  overflow:hidden; box-shadow:0 0 30px rgba(255,183,77,0.25), inset 0 0 20px rgba(255,183,77,0.1);
  animation:solBreathe 4s ease-in-out infinite;
}
#avatarFrame img {
  width:100%; height:100%; object-fit:cover; display:block;
}
/* Anillos orbitales */
.ring {
  position:absolute; border-radius:50%; border:1px solid rgba(255,183,77,0.2);
  pointer-events:none; animation:spin linear infinite;
}
.ring1 { width:75%; height:75%; animation-duration:8s; }
.ring2 { width:90%; height:90%; animation-duration:14s; border-style:dashed; border-color:rgba(255,183,77,0.1); }
.ring3 { width:100%; height:100%; animation-duration:20s; border-color:rgba(255,183,77,0.06); }
/* Scan sweep */
#scanSweep {
  position:absolute; left:-20%; right:-20%; height:50%; top:-25%;
  background:linear-gradient(180deg,transparent,rgba(255,220,150,0.15),transparent);
  animation:solScanSweep 7s linear infinite; mix-blend-mode:screen; pointer-events:none; z-index:5;
}
/* Párpados — sobre ojos reales (46%/54% x, 21% y) */
.eyelid {
  position:absolute; width:11%; height:6%; border-radius:50%;
  background:radial-gradient(ellipse,rgba(35,22,14,0.92),rgba(35,22,14,0.5) 70%,transparent);
  transform:translate(-50%,-50%) scaleY(0.05); transform-origin:center;
  opacity:0; transition:transform 0.08s ease,opacity 0.08s ease; pointer-events:none; z-index:6;
}
.eyelid.blink { transform:translate(-50%,-50%) scaleY(1); opacity:0.95; }
/* Boca — posición real (50%/30%) */
#mouth {
  position:absolute; left:50%; top:30%; width:13%; height:5%;
  transform:translate(-50%,-50%); border-radius:50%;
  background:radial-gradient(ellipse,rgba(120,50,40,0.55),rgba(120,50,40,0.25) 70%,transparent);
  opacity:0; mix-blend-mode:multiply; pointer-events:none; z-index:6;
}
#mouth.talking { opacity:1; animation:solTalk 0.42s ease-in-out infinite; }

/* Estado texto */
#solStatus {
  position:absolute; bottom:20px; left:0; right:0; text-align:center;
  font-size:0.75rem; color:#7a8a8a; z-index:8;
}

/* ═══ SIDEBAR ═══ */
#sidebar {
  width:320px; max-width:85vw; background:rgba(12,16,18,0.95);
  border-left:1px solid rgba(255,183,77,0.12); display:none; flex-direction:column;
  overflow-y:auto; z-index:10;
}
#sidebar.open { display:flex; }
#sidebar .section { padding:14px; border-bottom:1px solid rgba(255,183,77,0.08); }
#sidebar h3 { font-size:0.7rem; text-transform:uppercase; letter-spacing:2px; color:#7a8a8a; margin-bottom:10px; }
#sidebar .tool-btn {
  display:block; width:100%; padding:8px 10px; margin-bottom:4px;
  border:1px solid rgba(255,183,77,0.12); border-radius:8px;
  background:rgba(255,183,77,0.04); color:#e8e0d8; cursor:pointer;
  font-size:0.8rem; text-align:left; font-family:inherit;
}
#sidebar .tool-btn:active { background:rgba(255,183,77,0.18); }
#sidebar .mem-item { font-size:0.75rem; color:#9a9a8a; margin-bottom:6px; padding:6px; border-radius:6px; background:rgba(255,183,77,0.03); }
#sidebar .mem-item .role { color:#ffb74a; font-weight:600; }

/* ═══ CHAT ═══ */
#chat {
  flex-shrink:0; padding:10px 14px; background:rgba(15,20,22,0.95);
  border-top:1px solid rgba(255,183,77,0.12); display:flex; gap:8px; z-index:10;
}
#chatInput {
  flex:1; padding:10px 14px; border-radius:24px; border:1px solid rgba(255,183,77,0.2);
  background:rgba(20,25,28,0.9); color:#e8e0d8; font-size:0.9rem; font-family:inherit; outline:none;
}
#chatInput:focus { border-color:rgba(255,183,77,0.4); }
#sendBtn {
  width:44px; height:44px; border-radius:50%; border:none;
  background:#ffb74a; color:#0a0e0f; font-size:1.2rem; cursor:pointer; flex-shrink:0;
}

/* ═══ ANIMACIONES ═══ */
@keyframes solFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
@keyframes solBreathe { 0%,100%{transform:scale(1)} 50%{transform:scale(1.03)} }
@keyframes spin { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes solScanSweep { 0%{transform:translateY(-130%) rotate(12deg)} 100%{transform:translateY(130%) rotate(12deg)} }
@keyframes solTalk { 0%,100%{transform:translate(-50%,-50%) scaleY(0.4)} 50%{transform:translate(-50%,-50%) scaleY(1)} }

/* Toast */
#toast {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  background:rgba(255,183,77,0.15); color:#e8e0d8; padding:10px 20px; border-radius:20px;
  font-size:0.85rem; z-index:50; opacity:0; transition:opacity 0.3s; pointer-events:none; max-width:80vw;
}
#toast.show { opacity:1; }
</style>
</head>
<body>

<div id="topbar">
  <span class="dot"></span>
  <h1>SOL ☀️</h1>
  <span class="spacer"></span>
  <button id="toolsBtn">☰ Tools</button>
  <button id="silBtn">📚 SIL</button>
</div>

<div id="main">
  <div id="holo">
    <div id="holoCore">
      <div class="ring ring3"></div>
      <div class="ring ring2"></div>
      <div class="ring ring1"></div>
      <div id="avatarFrame">
        <img src="/static/sol_avatar.png" alt="Sol" id="avatarImg" />
        <div id="scanSweep"></div>
        <div class="eyelid" id="eyeL" style="left:46%;top:21%"></div>
        <div class="eyelid" id="eyeR" style="left:54%;top:21%"></div>
        <div id="mouth"></div>
      </div>
    </div>
    <div id="solStatus">☀️ Despierta…</div>
  </div>

  <div id="sidebar">
    <div class="section">
      <h3>Estado</h3>
      <div id="statusInfo">Cargando…</div>
    </div>
    <div class="section">
      <h3>Herramientas (20)</h3>
      <div id="toolsList">Cargando…</div>
    </div>
    <div class="section">
      <h3>Memoria reciente</h3>
      <div id="memoryList">Cargando…</div>
    </div>
    <div class="section">
      <h3>Integridad SHA-256</h3>
      <div id="integrityInfo">Cargando…</div>
    </div>
    <div class="section" id="silSection" style="display:none">
      <h3>SIL — Inmersión Lingüística</h3>
      <div id="silList">Cargando…</div>
    </div>
  </div>
</div>

<div id="chat">
  <input id="chatInput" placeholder="Habla con Sol…" autocomplete="off" />
  <button id="sendBtn">☀️</button>
</div>

<div id="toast"></div>

<script>
const API = ''; // mismo origen (:8001) — sin :8006
const headers = { 'Content-Type': 'application/json' };

// ── Estado ──
let speaking = false;
let blinkTimer = null;

// ── Parpadeo natural ──
function blink() {
  const eL = document.getElementById('eyeL');
  const eR = document.getElementById('eyeR');
  eL.classList.add('blink'); eR.classList.add('blink');
  setTimeout(() => { eL.classList.remove('blink'); eR.classList.remove('blink'); }, 120);
  scheduleBlink();
}
function scheduleBlink() {
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(blink, 2800 + Math.random() * 4000);
}
scheduleBlink();

// ── Toast ──
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ── Hablar (TTS con gTTS) ──
async function speak(text) {
  speaking = true;
  document.getElementById('mouth').classList.add('talking');
  try {
    const clean = text.replace(/[☀️🔥🔦📡📍🔋📊🔧⚠️❌✅]/g, '').trim().slice(0, 500);
    const url = `/api/sol/tts?text=${encodeURIComponent(clean)}`;
    const audio = new Audio(url);
    audio.onended = () => {
      speaking = false;
      document.getElementById('mouth').classList.remove('talking');
    };
    audio.onerror = () => {
      speaking = false;
      document.getElementById('mouth').classList.remove('talking');
    };
    await audio.play().catch(() => {
      speaking = false;
      document.getElementById('mouth').classList.remove('talking');
    });
  } catch {
    speaking = false;
    document.getElementById('mouth').classList.remove('talking');
  }
}

// ── Chat ──
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  document.getElementById('solStatus').textContent = '☀️ Pensando…';
  try {
    const r = await fetch(`/api/sol/think-voice`, {
      method: 'POST', headers,
      body: JSON.stringify({ message: text }),
    });
    const d = await r.json();
    const resp = d.response || '☀️ No entendí, Harold.';
    document.getElementById('solStatus').textContent = resp.slice(0, 100);
    toast(resp.slice(0, 200));
    if (d.tts_url) speak(resp);
    // Actualizar memoria
    loadMemory();
  } catch (e) {
    document.getElementById('solStatus').textContent = '⚠️ Error de conexión';
    toast('No pude conectar con mi cerebro.');
  }
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendMessage();
});

// ── Cargar estado ──
async function loadStatus() {
  try {
    const r = await fetch(`${API}/api/sol/status`);
    const d = await r.json();
    const info = document.getElementById('statusInfo');
    if (d.alive !== false) {
      info.innerHTML = `
        <div style="font-size:0.8rem;color:#e8e0d8">Personalidad: <b style="color:#ffb74a">${d.personality || 'cálida'}</b></div>
        <div style="font-size:0.75rem;color:#7a8a8a;margin-top:4px">Recuerdos: ${d.memories ?? '?'} | Daemon: ${d.daemon ? '✅' : '⚠️'}</div>
        ${d.system ? `<div style="font-size:0.7rem;color:#5a6a6a;margin-top:6px">CPU: ${d.system.cpu_pct?.toFixed(0) || '?'}% | RAM: ${d.system.ram_pct?.toFixed(0) || '?'}%</div>` : ''}
      `;
      document.getElementById('solStatus').textContent = '☀️ Despierta y atenta';
    } else {
      info.innerHTML = '<div style="color:#ff6a4a">⚠️ Sol offline</div>';
      document.getElementById('solStatus').textContent = '⚠️ Sol dormida';
    }
  } catch {
    document.getElementById('statusInfo').innerHTML = '<div style="color:#ff6a4a">⚠️ Sin conexión con :8001</div>';
    document.getElementById('solStatus').textContent = '⚠️ Desconectada';
  }
}

// ── Cargar herramientas ──
async function loadTools() {
  try {
    const r = await fetch(`${API}/api/sol/tools`);
    const d = await r.json();
    const list = document.getElementById('toolsList');
    if (!d.tools || d.tools.length === 0) {
      list.innerHTML = '<div style="color:#7a8a8a;font-size:0.8rem">No hay herramientas disponibles</div>';
      return;
    }
    list.innerHTML = d.tools.map(t => {
      const desc = d.descriptions?.[t] || '';
      return `<button class="tool-btn" data-tool="${t}" data-desc="${desc.replace(/"/g,'')}">🔧 ${t}</button>`;
    }).join('');
    // Event listeners
    list.querySelectorAll('.tool-btn').forEach(btn => {
      btn.onclick = async () => {
        const name = btn.dataset.tool;
        btn.style.opacity = '0.5';
        try {
          const r = await fetch(`${API}/api/sol/tools/execute`, {
            method: 'POST', headers,
            body: JSON.stringify({ name, args: name === 'flashlight' ? [true] : [] }),
          });
          const d = await r.json();
          if (d.success) {
            toast(`✅ ${name}: ${d.result}`);
          } else {
            toast(`❌ ${name}: ${d.error}`);
          }
        } catch {
          toast(`❌ Error ejecutando ${name}`);
        }
        btn.style.opacity = '1';
      };
    });
  } catch {
    document.getElementById('toolsList').innerHTML = '<div style="color:#ff6a4a">⚠️ Sin conexión</div>';
  }
}

// ── Cargar memoria ──
async function loadMemory() {
  try {
    const r = await fetch(`${API}/api/sol/memory?limit=10`);
    const d = await r.json();
    const list = document.getElementById('memoryList');
    if (!d.items || d.items.length === 0) {
      list.innerHTML = '<div style="color:#7a8a8a;font-size:0.8rem">Sin recuerdos aún</div>';
      return;
    }
    list.innerHTML = d.items.map(m =>
      `<div class="mem-item"><span class="role">${m.role}:</span> ${m.content} <span style="color:#5a6a6a;font-size:0.65rem">${m.ts || ''}</span></div>`
    ).join('');
  } catch {
    document.getElementById('memoryList').innerHTML = '<div style="color:#ff6a4a">⚠️ Sin conexión</div>';
  }
}

// ── Cargar integridad ──
async function loadIntegrity() {
  try {
    const r = await fetch(`${API}/api/sol/integrity`);
    const d = await r.json();
    const info = document.getElementById('integrityInfo');
    if (d.ok) {
      info.innerHTML = `
        <div style="font-size:0.75rem;color:#9aa89a">Cadena: ${d.head || '—'}</div>
        <div style="font-size:0.7rem;color:#5a6a6a;margin-top:4px">${d.links?.length || 0} eslabones verificados</div>
      `;
    } else {
      info.innerHTML = `<div style="color:#ff6a4a;font-size:0.8rem">${d.error || 'Verificación falló'}</div>`;
    }
  } catch {
    document.getElementById('integrityInfo').innerHTML = '<div style="color:#ff6a4a">⚠️ Sin conexión</div>';
  }
}

// ── SIL ──
async function loadSIL() {
  const sec = document.getElementById('silSection');
  const list = document.getElementById('silList');
  sec.style.display = 'block';
  try {
    const r = await fetch(`${API}/api/sil/lessons?language=chino`);
    const d = await r.json();
    if (d.lessons && d.lessons.length > 0) {
      list.innerHTML = d.lessons.map(l => `<div style="font-size:0.8rem;padding:4px 0;color:#9aa89a">📖 ${l}</div>`).join('');
    } else {
      list.innerHTML = '<div style="color:#7a8a8a;font-size:0.8rem">SIL no disponible en este dispositivo</div>';
    }
  } catch {
    list.innerHTML = '<div style="color:#7a8a8a;font-size:0.8rem">SIL no disponible</div>';
  }
}

// ── Sidebar toggle ──
document.getElementById('toolsBtn').onclick = () => {
  const sb = document.getElementById('sidebar');
  sb.classList.toggle('open');
  if (sb.classList.contains('open')) {
    loadStatus(); loadTools(); loadMemory(); loadIntegrity();
  }
};
document.getElementById('silBtn').onclick = () => {
  const sb = document.getElementById('sidebar');
  sb.classList.add('open');
  loadSIL();
  document.getElementById('silSection').scrollIntoView();
};

// ── Init ──
loadStatus();
setInterval(loadStatus, 30000); // refresh cada 30s
</script>
</body>
</html>
