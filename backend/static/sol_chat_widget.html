<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Sol</title>
<style>
:root{--g:#f59e0b;--bg:#0a0e17;--c:#111827;--t:#e2e8f0;--m:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100vh;background:var(--bg)}
.hd{display:flex;align-items:center;gap:8px;padding:10px;background:var(--c);border-radius:14px 14px 0 0;border:1px solid #1e293b}
.hd img{width:38px;height:38px;border-radius:50%;border:2px solid var(--g)}
.hd b{color:var(--g)}.hd span{font-size:11px;color:var(--m);margin-left:auto}
.hd button{background:none;border:none;font-size:16px;cursor:pointer;color:var(--t)}
.msgs{flex:1;overflow-y:auto;padding:10px;background:var(--bg);display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:8px 10px;border-radius:12px;font-size:13px;line-height:1.4}
.m.u{align-self:flex-end;background:var(--g);color:#000}
.m.s{align-self:flex-start;background:var(--c);border:1px solid #1e293b;color:var(--t)}
.in{display:flex;gap:6px;padding:8px;background:var(--c);border-radius:0 0 14px 14px;border:1px solid #1e293b}
.in input{flex:1;background:var(--bg);border:1px solid #1e293b;border-radius:8px;color:var(--t);padding:8px;outline:none}
.in button{border:none;border-radius:8px;background:var(--g);color:#000;font-weight:700;padding:8px 12px;cursor:pointer}
</style></head><body>
<div class="hd"><img src="/sol_avatar.png" alt="Sol"><b>Sol</b><span id="st">conectando…</span>
<button id="voz">🔊</button><button id="mic">🎙️</button></div>
<div class="msgs" id="msgs"></div>
<div class="in"><input id="inp" placeholder="Escríbele a Sol…"><button id="send">→</button></div>
<script>
const API='http://'+location.hostname+':8006';let voz=true;
const $=i=>document.getElementById(i);
function add(r,t){const d=document.createElement('div');d.className='m '+r;d.textContent=t;$('msgs').appendChild(d);$('msgs').scrollTop=1e6}
function say(t){if(!voz||!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';
 const v=speechSynthesis.getVoices().find(x=>/es/i.test(x.lang)&&/google/i.test(x.name))||speechSynthesis.getVoices().find(x=>/es/i.test(x.lang));
 if(v)u.voice=v;speechSynthesis.speak(u)}
async function j(p,o){try{const r=await fetch(API+p,o);return await r.json()}catch(e){return null}}
async function send(){const t=$('inp').value.trim();if(!t)return;$('inp').value='';add('u',t);
 const r=await j('/api/sol/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});
 const q=r&&r.reply?r.reply:'☀️ Estoy aquí, Harold.';add('s',q);say(q)}
$('send').onclick=send;$('inp').onkeydown=e=>{if(e.key==='Enter')send()};
$('voz').onclick=()=>{voz=!voz;$('voz').style.opacity=voz?1:.4};
$('mic').onclick=()=>{const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;
 const s=new S();s.lang='es-ES';s.onresult=e=>{$('inp').value=e.results[0][0].transcript;send()};s.start()};
(async()=>{const s=await j('/api/sol/state');$('st').textContent=s?'despierta · '+s.memories+' recuerdos':'offline';
 add('s','☀️ Estoy aquí, Harold.')})();
</script></body></html>
