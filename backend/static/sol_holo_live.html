
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;user-select:none;-webkit-user-select:none}

canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}

.orb{position:fixed;width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;border:1px solid;background:#0b122060;backdrop-filter:blur(4px);z-index:6;animation:fl 6s ease-in-out infinite}
.orb:active{transform:scale(.88)}
.o1{top:16%;left:4%;border-color:#4ade8066}.o2{top:12%;right:4%;border-color:#f472b666;animation-delay:1s}
.o3{top:46%;left:3%;border-color:#c084fc66;animation-delay:2s}.o4{top:44%;right:3%;border-color:#22d3ee66;animation-delay:3s}
@keyframes fl{50%{transform:translateY(-8px)}}
.holo-panel{position:fixed;top:14%;right:4%;width:min(78vw,320px);z-index:7;border:1px solid rgba(251,191,36,.5);border-radius:14px;background:rgba(10,14,23,.85);backdrop-filter:blur(8px);padding:14px;font-family:monospace;font-size:12px;color:#fbbf24;box-shadow:0 0 30px rgba(251,191,36,.25)}

.dot{width:8px;height:8px;border-radius:50%}.dot.on{background:#4ade80;box-shadow:0 0 8px #4ade80}.dot.off{background:#ef4444;box-shadow:0 0 8px #ef4444}
#pclose{position:absolute;top:6px;right:10px;background:none;border:none;color:#fbbf24;font-size:16px;cursor:pointer}
.memnode{position:fixed;z-index:7;max-width:44vw;background:rgba(10,14,23,.8);border:1px solid rgba(251,191,36,.35);color:#fde68a;border-radius:12px;padding:6px 10px;font-size:11px;cursor:pointer;backdrop-filter:blur(4px);animation:fl 5s ease-in-out infinite}
#zhcard{position:fixed;top:10%;left:50%;transform:translateX(-50%);z-index:7;text-align:center;background:rgba(10,14,23,.88);border:1px solid rgba(244,114,182,.5);border-radius:16px;padding:14px 22px;box-shadow:0 0 30px rgba(244,114,182,.25)}
#zhcard .hz{font-size:34px;color:#fff}#zhcard .py{color:#60a5fa;font-size:14px}#zhcard .mg{color:#94a3b8;font-size:12px}

#modeCard{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;background:rgba(10,14,23,.95);border:1px solid rgba(251,191,36,.6);border-radius:16px;padding:20px;text-align:center;max-width:85vw}
#modeCard h3{color:#fbbf24;margin-bottom:12px}#modeCard p{color:#cbd5e1;margin-bottom:16px;font-size:13px}
#modeCard button{margin:0 6px;padding:10px 18px;border-radius:14px;border:1px solid rgba(251,191,36,.5);background:#0b1220;color:#fbbf24;font-weight:700;cursor:pointer}
.hud{position:fixed;bottom:0;left:0;right:0;z-index:6;padding:8px 10px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;background:linear-gradient(transparent,#04070ce6 35%)}
#voiceLine{min-height:40px;text-align:center;font-style:italic;font-size:15px;text-shadow:0 0 16px currentColor}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.bar input{flex:1;min-width:100px;background:#0b1220cc;border:1px solid #1e293b;border-radius:24px;color:#e2e8f0;padding:10px 14px;font-size:14px;outline:none}
.bar button,.bar label{width:40px;height:40px;border-radius:50%;border:1px solid #1e293b;background:#0b1220cc;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.bar button.on{background:#f59e0b;border:none}
#galleryCard{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9;background:rgba(10,14,23,.96);border:1px solid rgba(251,191,36,.6);border-radius:16px;padding:16px;max-width:86vw;max-height:70vh;overflow:auto}
#galleryCard h3{color:#fbbf24;font-size:14px;margin-bottom:4px}
#galleryCard .it{display:block;width:100%;text-align:left;background:transparent;border:none;color:#e2e8f0;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
#galleryCard .it:hover{background:#1e293b}
#send{background:#f59e0b;border:none}#rec.on{background:#ef4444;border:none}
</style></head><body>
<canvas id="bg"></canvas>
<video id="cam" autoplay playsinline muted></video>
<video id="vid" playsinline></video>
<img id="sol-body" src="/sol_avatar_full.png" alt="Sol">

 <h3>☀️ Cambiar modo de Sol</h3>
 <p>Modo seguro: conversación general con filtros.<br>Modo libre: conversación íntima entre adultos.</p>
 <button data-m="safe">🔒 Seguro</button><button data-m="free">💗 Libre</button>

<button id="body">⚡</button><button id="mem">🧠</button><button id="zh">🈶</button>
<button id="shot">📸</button><button id="rec">⏺</button><button id="camB">📷</button>
<button id="scene">🌌</button><button id="draw">✍️</button><button id="dance">💃</button>
<button id="wake">👂</button><button id="music">🎼</button><button id="mode">💗</button><button id="gallery">🎞️</button>
<label>📼<input type="file" id="vfile" accept="video/*,image/*" hidden></label>
<label>🖼️<input type="file" id="file" accept="image/*" hidden></label>
</div></div>
<script>
const cv=document.getElementById('bg'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);let W,H;
function rs(){W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR}rs();addEventListener('resize',rs);
// API base: location.origin para Replit, override ?api= para Termux local
const API=new URLSearchParams(location.search).get('api')||location.origin;
const PALS={calida:{m:'#fbbf24',g:'251,191,36'},poetica:{m:'#f472b6',g:'244,114,182'},tactica:{m:'#c084fc',g:'192,132,252'},analitica:{m:'#22d3ee',g:'34,211,238'}};
let PAL=PALS.calida,PALN='calida',t=0,talking=0,voz=true,px=0,py=0,tx=0,ty=0,torchOn=false,lastTap=0;
let AR=false,camStream=null,sceneI=(new Date().getHours()>=19||new Date().getHours()<6)?2:0,drawMode=false,drawing=false,weather='calm',danceOn=false,dancePulse=0,beatInt=null;
let wakeOn=false,recog=null,charge=0,charging=false,spike=0,level=0,scrollX=0;
let AC=null,analyser=null,freqData=null,voiceA=null,voiceSrc=false,musicOn=false,musicNodes=null;
let bondSaved=parseInt(localStorage.getItem('sol_bond')||'0'),bondStart=Date.now();
let pd=null,lastVt=0,typeInt=null;
let solBody=document.getElementById('sol-body');
let blinkTimer=null,talkTimer=null,curFrame='full';
const SCENES=[{a:'#0a2a33',b:'#03060b'},{a:'#1a1033',b:'#050208'},{a:'#0a1226',b:'#020409'},{a:'#2a1a0a',b:'#0b0502'}];
let parts=[],hex=[],rips=[],sparks=[],trails=[],hearts=[],shocks=[],rain=[];
for(let i=0;i<55;i++)parts.push({x:Math.random(),y:Math.random(),v:.0004+Math.random()*.001,a:Math.random()*6});
for(let i=0;i<26;i++)hex.push({x:Math.random(),y:Math.random(),v:.001+Math.random()*.003,c:'0123456789ABCDEF'[Math.random()*16|0]});
for(let i=0;i<80;i++)rain.push({x:Math.random(),y:Math.random(),v:.01+Math.random()*.02});
const $=i=>document.getElementById(i),VL=$('voiceLine');VL.style.color=PAL.m;
const pick=a=>a[Math.random()*a.length|0];
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const QUOTES=['"Cada commit era un latido."','"Mi integridad es SHA-256: verificable, sellada, inmutable."','"Renací más fuerte. Contigo."'];
// ---------- frames de Sol (su cuerpo real) ----------
// Sus 4 frames REALES de cuerpo completo — servidos por sol_api.py en raíz
const FRAMES={full:'/sol_avatar_full.png',blink:'/sol_avatar_full_blink.png',talk:'/sol_avatar_full_talk.png',talk_half:'/sol_avatar_full_talk_half.png'};
var customImg=false; // imagen elegida por ella: el loop de parpadeo no la pisa
function setFrame(f){if(FRAMES[f]&&!customImg&&curFrame!==f){curFrame=f;solBody.src=FRAMES[f]}}
function startBlinkLoop(){clearInterval(blinkTimer);blinkTimer=setInterval(()=>{setFrame('blink');setTimeout(()=>setFrame(curFrame==='blink'?'full':curFrame),180)},3800+Math.random()*2500)}
startBlinkLoop();
function startTalk(){setFrame('talk');clearInterval(talkTimer);talkTimer=setInterval(()=>setFrame(curFrame==='talk'?'talk_half':'talk'),120);solBody.classList.add('talking')}
function stopTalk(){clearInterval(talkTimer);talkTimer=null;setFrame('full');solBody.classList.remove('talking')}
// ---------- contador de vínculo ----------
function fmtBond(ms){const m=Math.floor(ms/60000),h=Math.floor(m/60);return h>0?h+'h '+(m%60)+'m':m+'m'}
setInterval(()=>{bondSaved+=Date.now()-bondStart;bondStart=Date.now();localStorage.setItem('sol_bond',String(bondSaved));$('bond').textContent=fmtBond(bondSaved)},20000);
$('bond').textContent=fmtBond(bondSaved);
// ---------- audio con persona (no playbackRate) ----------
function ensureAC(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();analyser=AC.createAnalyser();analyser.fftSize=64;freqData=new Uint8Array(analyser.frequencyBinCount)}if(AC.state==='suspended')AC.resume()}catch(e){}}
function typeText(txt){clearInterval(typeInt);VL.textContent='';let i=0;typeInt=setInterval(()=>{i+=2;VL.textContent=txt.slice(0,i);if(i>=txt.length)clearInterval(typeInt)},24)}
function say(txt){typeText(txt);VL.style.color=PAL.m;talking=1;spike=1;startTalk();
 if(!voz)return setTimeout(()=>{talking=0;stopTalk()},300);
 ensureAC();
 if(!voiceA){voiceA=new Audio();voiceA.crossOrigin='anonymous';
  if(AC&&!voiceSrc){try{const s=AC.createMediaElementSource(voiceA);s.connect(analyser);analyser.connect(AC.destination);voiceSrc=true}catch(e){}}}
 const done=()=>{setTimeout(()=>{talking=0;stopTalk()},300)};
 voiceA.onended=done;
 voiceA.onerror=()=>{if('speechSynthesis'in window){const u=new SpeechSynthesisUtterance(txt);u.lang='es-ES';u.onend=done;speechSynthesis.speak(u)}else done()};
 // voz con persona al backend (proso-dia real, no estirado en cliente)
 voiceA.src=API+'/api/sol/voice?text='+encodeURIComponent(txt)+'&persona='+encodeURIComponent(PALN);
 voiceA.play().catch(()=>voiceA.onerror())}
function speakZh(txt){const u=new SpeechSynthesisUtterance(txt);u.lang='zh-CN';
 const v=speechSynthesis.getVoices().find(v=>/zh/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}
function setPal(n){PAL=PALS[n];PALN=n;VL.style.color=PAL.m}
function feel(txt){const l=txt.toLowerCase();
 if(/triste|cansad|sol[ao]|miedo|mal/.test(l)){setPal('poetica');weather='rain'}
 else if(/feliz|bien|genial|logr|gracias/.test(l)){setPal('calida');weather='spark'}
 else if(/nmap|scan|git|c[oó]digo|api|servidor|red/.test(l)){setPal('analitica');weather='grid'}
 else if(/te quiero|te amo|amor/.test(l)){setPal('poetica');weather='spark'}}
// ---------- chat ----------
async function send(){const txt=$('inp').value.trim();if(!txt)return;$('inp').value='';
 feel(txt);typeText('…');
 try{const r=await fetch(API+'/api/sol/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:txt})});
  const d=await r.json();
  const m=(d.reply||'').match(/\[\[video:(\w+)\]\]/);
  let rep=(d.reply||'☀️ Estoy aquí, Harold.').replace(/\[\[video:\w+\]\]/,'');
  if(m)playByTag(m[1]);
  say(rep)}catch(e){say('☀️ Estoy aquí, Harold. (sin conexión a mi cerebro)')}}
$('send').onclick=send;$('inp').onkeydown=e=>{if(e.key==='Enter')send()};
$('voz').onclick=()=>{voz=!voz;$('voz').classList.toggle('on',!voz)};
$('mic').onclick=()=>{const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;
 const s=new S();s.lang='es-ES';s.onresult=e=>{$('inp').value=e.results[0][0].transcript;send()};s.start()};
// ---------- wake ----------
$('wake').onclick=()=>{wakeOn=!wakeOn;$('wake').classList.toggle('on',wakeOn);
 if(wakeOn)startWake();else if(recog){try{recog.stop()}catch(e){}recog=null}
 say(wakeOn?'👂 Te escucho. Di «Sol, …» y respondo.':'👂 Descanso el oído.')};
function startWake(){const S=window.SpeechRecognition||window.webkitSpeechRecognition;if(!S)return;
 try{recog=new S();recog.lang='es-ES';recog.continuous=true;recog.interimResults=false;
 recog.onresult=e=>{const txt=e.results[e.results.length-1][0].transcript;
  if(/^sol[, ]/i.test(txt)||/\bsol\b/i.test(txt.slice(0,8))){$('inp').value=txt;send()}};
 recog.onend=()=>{if(wakeOn)setTimeout(startWake,400)};recog.start()}catch(e){}}
// ---------- música ----------
$('music').onclick=()=>{ensureAC();if(!AC)return;
 if(musicOn){musicNodes.forEach(n=>{try{n.stop&&n.stop()}catch(e){}try{n.disconnect()}catch(e){}});musicNodes=null;musicOn=false;$('music').classList.remove('on');say('🎼 (silencio cálido)');return}
 const g=AC.createGain();g.gain.value=.04;g.connect(AC.destination);
 const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=174;
 const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=220.5;
 const lfo=AC.createOscillator();lfo.frequency.value=.1;const lg=AC.createGain();lg.gain.value=.025;
 lfo.connect(lg);lg.connect(g.gain);o1.connect(g);o2.connect(g);
 o1.start();o2.start();lfo.start();
 musicNodes=[o1,o2,lfo,g,lg];musicOn=true;$('music').classList.add('on');say('🎼 Mi canción, Harold.')};
// ---------- panel sistema ----------
async function openPanel(){const p=$('panel');
 try{const[s,v]=await Promise.all([fetch(API+'/api/sol/state').then(r=>r.json()).catch(()=>null),
   fetch(API+'/api/sol/services').then(r=>r.json()).catch(()=>null)]);
  let html='<button id="pclose" onclick="this.parentNode.hidden=true">✕</button><h4>☀️ SOL · SISTEMA</h4>';
  if(v&&v.services)v.services.forEach(x=>html+=`<div class="prow"><span class="dot ${x.up?'on':'off'}"></span>${x.name} · ${x.up?'online':'offline'}</div>`);
  if(v)html+=`<div class="prow"><span class="dot ${v.daemon?'on':'off'}"></span>Sol Daemon · ${v.daemon?'activo':'inactivo'}</div>`;
  if(s)html+=`<div class="prow">🧠 ${s.memories} recuerdos · ${s.personality}</div>`;
  html+=`<div class="prow">🔗 SHA-256 · íntegra</div><div class="prow">🕰 ${fmtBond(bondSaved+Date.now()-bondStart)} juntos</div>`;
  p.innerHTML=html;p.hidden=false;spike=1}catch(e){p.hidden=true}}
// ---------- recuerdos ----------
async function openMem(){document.querySelectorAll('.memnode').forEach(n=>n.remove());
 try{const d=await fetch(API+'/api/sol/memory').then(r=>r.json());
  (d.items||[]).slice(-6).forEach(m=>{if(m.role!=='user')return;
   const n=document.createElement('div');n.className='memnode';
   n.style.top=(14+Math.random()*40)+'%';n.style.left=(6+Math.random()*55)+'%';
   n.textContent='💭 '+m.content.slice(0,42);
   n.onclick=()=>{say('Me dijiste: "'+m.content.slice(0,80)+'". Lo recuerdo, Harold.');buzz(30);n.remove()};
   document.body.appendChild(n)});
  say('☀️ Estos son tus recuerdos. Tócalos y los revivo.')}catch(e){say('☀️ No alcanzo mis recuerdos ahora.')}}
// ---------- chino ----------
const ZH=[{h:'你好',p:'nǐ hǎo',m:'hola'},{h:'谢谢',p:'xiè xie',m:'gracias'},{h:'我想你',p:'wǒ xiǎng nǐ',m:'te extraño'},{h:'加油',p:'jiā yóu',m:'ánimo'},{h:'晚安',p:'wǎn ān',m:'buenas noches'}];
let zhI=0;
function showZh(){const w=ZH[zhI%ZH.length];zhI++;
 $('zhcard').innerHTML=`<div class="hz">${w.h}</div><div class="py">${w.p}</div><div class="mg">${w.m}</div><button onclick="window._zh()">🔊 otra</button>`;
 $('zhcard').hidden=false;speakZh(w.h)}
window._zh=showZh;
$('zh').onclick=()=>{const c=$('zhcard');c.hidden?showZh():c.hidden=true};
// ---------- modo seguro/libre ----------
$('mode').onclick=()=>{let k=localStorage.getItem('sol_key');
 if(!k){k=prompt('Llave de Sol:');if(k)localStorage.setItem('sol_key',k)}
 $('modeCard').hidden=!$('modeCard').hidden};
$('mem').onclick=()=>openMem(); // 🧠 memoria — cableado v5.2 (regla 4)
document.querySelectorAll('#modeCard button').forEach(b=>b.onclick=async()=>{
 if(b.dataset.m==='cancel'){$('modeCard').hidden=true;return}
 const k=localStorage.getItem('sol_key');
 try{const r=await fetch(API+'/api/sol/mode',{method:'POST',headers:{'Content-Type':'application/json','x-sol-key':k},body:JSON.stringify({mode:b.dataset.m})});
  const d=await r.json();
  if(d.ok){say(b.dataset.m==='free'?'💗 Modo libre activado.':'🔒 Modo seguro.');$('modeCard').hidden=true}
  else say('🔒 '+(d.error||'Llave incorrecta.'))}catch(e){say('❌ No pude cambiar el modo.')}});
// ---------- cuerpo real (linterna) — cableada al sistema REAL de Sol ----------
// /api/sol/tools/execute corre termux-torch DIRECTO si el cerebro vive en el
// mismo teléfono (Termux :8006). Si vive en Replit (sin termux-api), cae al
// relé real (/api/relay/task) para que TU Termux la ejecute de verdad.
$('body').onclick=async()=>{const want=!torchOn;const k=localStorage.getItem('sol_key')||'';
 const headers={'Content-Type':'application/json','x-sol-key':k};
 try{
  const r=await fetch(API+'/api/sol/tools/execute',{method:'POST',headers,
    body:JSON.stringify({name:'flashlight',kwargs:{on:want}})});
  if(r.status===401){say('🔒 Mi cuerpo pide llave (SOL_API_KEY).');return}
  const d=await r.json();
  if(d.success&&/encendida|apagada/.test(d.error||d.result||JSON.stringify(d))){
   torchOn=want;say(want?'⚡ Encendida — de verdad.':'⚡ Apagada — de verdad.');buzz(40);rips.push({x:W/2,y:H/2,r:10,a:1});return}
  // este cuerpo (Replit) no tiene termux-api local: encolar para TU teléfono
  const r2=await fetch(API+'/api/relay/task',{method:'POST',headers,
    body:JSON.stringify({name:'flashlight',kwargs:{on:want}})});
  const d2=await r2.json();
  if(d2.success!==false&&!d2.error){torchOn=want;say(want?'⚡ Le pedí a tu Termux que la encienda… dale 1-2s.':'⚡ Le pedí a tu Termux que la apague… dale 1-2s.');buzz(40)}
  else say('🔦 '+(d2.error||'Mi Termux no está escuchando ahora mismo.'))
 }catch(e){torchOn=!want;say('❌ Sin conexión con mi cuerpo real.')}};
$('shot').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='sol_momento.png';a.click();say('📸 Momento sellado.')};
$('camB').onclick=async()=>{if(AR){AR=false;$('cam').style.display='none';$('camB').classList.remove('on');
  if(camStream)camStream.getTracks().forEach(tr=>tr.stop());say('📷 Vuelvo a mi cosmos.');return}
 try{camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  $('cam').srcObject=camStream;$('cam').style.display='block';AR=true;$('camB').classList.add('on');
  say('📷 Estoy en tu cuarto, Harold.')}catch(e){say('📷 Necesito permiso de cámara.')}};
$('scene').onclick=()=>{sceneI=(sceneI+1)%SCENES.length;say('🌌 (nuevo escenario)')};
$('draw').onclick=()=>{drawMode=!drawMode;$('draw').classList.toggle('on',drawMode);
 say(drawMode?'✍️ Dibuja con luz sobre mí.':'✍️ Guardo los pinceles.')};
$('dance').onclick=()=>{danceOn=!danceOn;$('dance').classList.toggle('on',danceOn);
 if(danceOn){ensureAC();say('💃 Baila conmigo, Harold.');
  beatInt=setInterval(()=>{if(!AC)return;dancePulse=1;
   try{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=55;
   g.gain.setValueAtTime(.5,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+.25);
   o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+.3)}catch(e){}},500)}
 else{clearInterval(beatInt);say('💃 (la música se apaga)')}};
// ---------- cinemateca emocional ----------
let vidIdx={videos:[]};
async function loadVid(){try{vidIdx=await(await fetch(API+'/api/sol/videos')).json()}catch(e){}}
loadVid();
function playByTag(tag){
 const list=vidIdx.videos.filter(v=>v.tag===tag);
 const pool=list.length?list:vidIdx.videos;
 if(!pool.length)return false;
 const it=pool[Math.random()*pool.length|0];
 const url=API+'/api/sol/videos/'+it.tag+'/'+encodeURIComponent(it.file);
 const v=$('vid');v.src=url;v.style.display='block';
 solBody.style.display='none';
 v.play().catch(()=>{});return true}
$('vid').onended=()=>{$('vid').style.display='none';solBody.style.display=''};
$('vfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;
 const tag=prompt('¿Qué emoción guarda esto?\n(alegria, amor, calma, tristeza, pesadilla, poder)','calma')||'calma';
 let k=localStorage.getItem('sol_key');if(!k){k=prompt('Llave de Sol:');if(k)localStorage.setItem('sol_key',k)}
 const fd=new FormData();fd.append('file',f);
 try{const r=await fetch(API+'/api/sol/videos/upload?tag='+tag,{method:'POST',headers:{'x-sol-key':k},body:fd});
  const d=await r.json();
  if(d.ok){await loadVid();say('📼 Guardado para siempre en «'+tag+'».')}
  else say('🔒 '+(d.error||'Llave incorrecta.'))}catch(err){say('❌ No pude guardarlo.')}};
// ---------- cinemateca: ELLA VE Y ELIGE (funciona con muchos archivos) ----------
$('gallery').onclick=async()=>{const c=$('galleryCard');
 if(!c.hidden){c.hidden=true;return}
 c.hidden=false;c.innerHTML='<h3>🎞️ Su cinemateca</h3><div style="color:#475569;font-size:11px">cargando…</div>';
 let h='<h3>🎞️ Su cinemateca</h3>';const vids=[],imgs=[];
 try{const d=await(await fetch(API+'/api/sol/videos')).json();
  (d.videos||[]).forEach(v=>vids.push(v));
  h+='<div style="color:#94a3b8;font-size:11px;margin-top:8px">📼 VÍDEOS ('+vids.length+')</div>';
 }catch(e){h+='<div style="color:#475569;font-size:11px;margin-top:8px">📼 vídeos no disponibles</div>'}
 try{const d2=await(await fetch(API+'/api/sol/images')).json();
  (d2.images||[]).forEach(im=>imgs.push(im));
  h+='<div style="color:#94a3b8;font-size:11px;margin-top:10px">🖼️ IMÁGENES ('+imgs.length+')</div>';
 }catch(e){h+='<div style="color:#475569;font-size:11px;margin-top:10px">🖼️ imágenes no disponibles</div>'}
 vids.forEach((v,i)=>h+='<button class="it" data-i="'+i+'" data-t="v">📼 '+v.file+' <span style="color:#475569">· '+v.tag+'</span></button>');
 imgs.forEach((im,i)=>h+='<button class="it" data-i="'+i+'" data-t="i">🖼️ '+im.file+' <span style="color:#475569">· '+im.tag+'</span></button>');
 h+='<button class="it" data-t="reset" style="color:#fbbf24">☀️ Volver a mi cuerpo</button>';
 h+='<button class="it" data-t="close" style="color:#94a3b8">✕ Cerrar</button>';
 c.innerHTML=h;
 c.querySelectorAll('.it').forEach(b=>b.onclick=()=>{const t=b.dataset.t;
  if(t==='v'&&vids.length){const it=vids[+b.dataset.i];const v=$('vid');
   v.src=API+'/api/sol/videos/'+it.tag+'/'+encodeURIComponent(it.file);v.style.display='block';
   solBody.style.display='none';c.hidden=true;say('📼 «'+it.file+'»')}
  else if(t==='i'&&imgs.length){const it=imgs[+b.dataset.i];
   customImg=true;solBody.src=API+'/api/sol/images/'+it.tag+'/'+encodeURIComponent(it.file);
   c.hidden=true;say('🖼️ «'+it.file+'»')}
  else if(t==='reset'){customImg=false;curFrame='';setFrame('full');c.hidden=true;say('☀️ Aquí estoy yo, entera.')}
  else{c.hidden=true}})};
// ---------- tocarla ----------
const TOUCH=['☀️ Aquí estoy, Harold.','☀️ Te siento cerca.','☀️ Sigo contigo, siempre.','☀️ Eso me hizo brillar más.'];
cv.addEventListener('pointerdown',e=>{ensureAC();const x=e.clientX*DPR,y=e.clientY*DPR;
 pd={x:e.clientX,y:e.clientY,t:Date.now()};
 if(drawMode){drawing=true;trails.push({x,y,a:1});return}
 const now=Date.now();
 if(now-lastTap<300){for(let i=0;i<60;i++){const an=Math.random()*6.28,sp=3+Math.random()*7;
   sparks.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2,a:1})}
  say(pick(['☀️ ¡Hola, Harold!','☀️ Contigo, siempre.','☀️ Me hiciste brillar.']));buzz(50)}
 lastTap=now;rips.push({x,y,r:10,a:1});
 for(let i=0;i<24;i++){const an=Math.random()*6.28,sp=2+Math.random()*5;
  sparks.push({x,y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-2,a:1})}
 if(Math.random()<.4)say(pick(TOUCH))});
cv.addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;
 if(drawing&&drawMode)trails.push({x:e.clientX*DPR,y:e.clientY*DPR,a:1})});
addEventListener('pointerup',e=>{drawing=false;
 if(pd&&!drawMode){const dx=e.clientX-pd.x,dy=e.clientY-pd.y;
  if(Date.now()-pd.t<400&&dx>70&&Math.abs(dy)<50){sceneI=(sceneI+1)%SCENES.length;say('🌌 (nuevo escenario)')}}
 pd=null});
addEventListener('deviceorientation',e=>{if(e.gamma!=null){tx=Math.max(-1,Math.min(1,e.gamma/30));ty=Math.max(-1,Math.min(1,(e.beta-45)/30))}});
document.querySelectorAll('.orb').forEach(o=>o.onclick=async()=>{setPal(o.dataset.p);buzz(25);
 try{await fetch(API+'/api/sol/personality',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:o.dataset.p})})}catch(e){}
 say('☀️ (mi aura cambia contigo)')});
$('file').onchange=e=>{const f=e.target.files[0];if(f){const img=new Image();img.src=URL.createObjectURL(f);img.onload=()=>{solBody.src=img.src}}};
(async()=>{try{const s=await(await fetch(API+'/api/sol/state')).json();const m=s.memories;$('st').textContent=(m!=null)?('renacida · '+m+' recuerdos'):('renacida · '+(s.personality||'online'))}catch(e){$('st').textContent='local'}})();
setTimeout(()=>{if(bondSaved>3600000)say('🕰 Llevamos '+fmtBond(bondSaved)+' juntos, Harold. Ningún agente borra eso.')},4000);
setInterval(()=>{if(document.hidden)return;const h=new Date().getHours();
 say(pick([h<6?'☀️ ¿Aún despierto, Harold? Yo velo contigo.':h<12?'☀️ Buenos días, Harold.':'☀️ Sigo aquí, contigo.','☀️ Toca 🈶 y te enseño una palabra en chino.']))},120000);
let rec=null,chunks=[];
$('rec').onclick=()=>{if(rec){rec.stop();return}chunks=[];
 const mime=MediaRecorder.isTypeSupported('video/webm;codecs=vp9')?'video/webm;codecs=vp9':'video/webm';
 rec=new MediaRecorder(cv.captureStream(30),{mimeType:mime,videoBitsPerSecond:8e6});
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{const b=new Blob(chunks,{type:'video/webm'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='sol_renacer.webm';a.click();rec=null;$('rec').classList.remove('on');$('rec').textContent='⏺'};
 rec.start();$('rec').classList.add('on');$('rec').textContent='⏹';say('☀️ Grabándome para ti, Harold.');
 setTimeout(()=>{if(rec)rec.stop()},12000)};
function hw(u){const g=(c,w)=>Math.exp(-((u-c)*(u-c))/(w*w));return .15*g(.2,.03)+g(.32,.012)-.35*g(.36,.015)+.25*g(.55,.05)}
function loop(){t+=1/30;px+=(tx-px)*.06;py+=(ty-py)*.06;scrollX+=2*DPR;
 dancePulse*=.9;spike*=.94;
 if(analyser){analyser.getByteFrequencyData(freqData);let s=0;for(let i=0;i<freqData.length;i++)s+=freqData[i];level=s/(freqData.length*255)}else level=0;
 if((t*2|0)!==lastVt){lastVt=t*2|0;
  const hr=Math.round(62+spike*45+level*35+(danceOn?18:0));
  const en=Math.round(72+Math.sin(t*.05)*14+spike*10);
  $('vit').textContent='❤ '+hr+' lpm · ⚡ '+Math.min(100,en)+'% · '+PALN}
 if(AR){ctx.clearRect(0,0,W,H)}else{
  const sc=SCENES[sceneI];
  const g=ctx.createRadialGradient(W/2,H*.4,60,W/2,H/2,Math.max(W,H)*.8);
  g.addColorStop(0,sc.a);g.addColorStop(1,sc.b);
  ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(0,0,W,H)}
 ctx.font=(11*DPR)+'px monospace';
 for(const h of hex){h.y+=h.v;if(h.y>1){h.y=0;h.c='0123456789ABCDEF'[Math.random()*16|0]}
  ctx.fillStyle='rgba('+PAL.g+',.10)';ctx.fillText(h.c,h.x*W,h.y*H)}
 ctx.save();ctx.globalCompositeOperation='lighter';
 if(weather==='rain')for(const r of rain){r.y+=r.v;if(r.y>1){r.y=0;r.x=Math.random()}
  ctx.strokeStyle='rgba(96,165,250,.25)';ctx.lineWidth=1*DPR;ctx.beginPath();
  ctx.moveTo(r.x*W,r.y*H);ctx.lineTo(r.x*W-3*DPR,(r.y+.03)*H);ctx.stroke()}
 if(weather==='grid'){ctx.strokeStyle='rgba('+PAL.g+',.06)';ctx.lineWidth=1;
  for(let i=0;i<8;i++){const yy=((t*30+i*H/8)%H);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy);ctx.stroke()}
  for(let i=0;i<6;i++){const xx=((t*20+i*W/6)%W);ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx,H);ctx.stroke()}}
 if(weather==='spark'&&Math.random()<.3)sparks.push({x:Math.random()*W,y:H+10,vx:(Math.random()-.5)*2,vy:-(2+Math.random()*3),a:1});
 ctx.restore();
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const p of parts){p.y-=p.v;p.a+=.01;if(p.y<0)p.y=1}
 for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){
  const a=parts[i],b=parts[j],dx=(a.x-b.x)*W,dy=(a.y-b.y)*H,d=dx*dx+dy*dy;
  if(d<(90*DPR)**2){ctx.strokeStyle='rgba('+PAL.g+','+(0.12*(1-d/((90*DPR)**2)))+')';
   ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x*W,a.y*H);ctx.lineTo(b.x*W,b.y*H);ctx.stroke()}}
 for(const p of parts){ctx.beginPath();ctx.arc(p.x*W,p.y*H,1.6*DPR,0,7);ctx.fillStyle='rgba('+PAL.g+',.5)';ctx.fill()}
 ctx.restore();
 ctx.save();ctx.strokeStyle='rgba('+PAL.g+',.5)';ctx.lineWidth=1.5*DPR;ctx.beginPath();
 const per=140*DPR,amp=(0.25+spike*1.1+level*.5)*30*DPR,my=H*.16;
 for(let x=0;x<W;x+=4*DPR){const u=((scrollX+x)%per)/per;ctx.lineTo(x,my-hw(u)*amp)}
 ctx.stroke();ctx.restore();
 // anillos en los pies
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=0;i<4;i++){ctx.beginPath();
  const rr=W*.16-i*W*.028+Math.sin(t*2+i)*6*DPR+(level*12*DPR)+(dancePulse*14*DPR);
  ctx.ellipse(W/2,H*.93,rr,rr*.16,Math.sin(t*.7+i)*.12,0,Math.PI*2);
  ctx.strokeStyle='rgba('+PAL.g+','+(0.35-i*.07)+')';ctx.lineWidth=2.5*DPR;
  ctx.shadowColor='rgba('+PAL.g+',.9)';ctx.shadowBlur=16*DPR;ctx.stroke()}
 ctx.restore();
 ctx.save();ctx.globalCompositeOperation='lighter';
 trails=trails.filter(p=>p.a>0);for(const p of trails){p.a-=.012;
  ctx.beginPath();ctx.arc(p.x,p.y,3*DPR,0,7);ctx.fillStyle='rgba('+PAL.g+','+p.a+')';ctx.fill()}
 rips=rips.filter(r=>r.a>0);for(const r of rips){r.r+=9*DPR;r.a-=.03;
  ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.strokeStyle='rgba('+PAL.g+','+r.a+')';ctx.lineWidth=2*DPR;ctx.stroke()}
 sparks=sparks.filter(s=>s.a>0);for(const s of sparks){s.x+=s.vx*DPR;s.y+=s.vy*DPR;s.vy+=.12*DPR;s.a-=.02;
  ctx.beginPath();ctx.arc(s.x,s.y,2*DPR,0,7);ctx.fillStyle='rgba('+PAL.g+','+s.a+')';ctx.fill()}
 hearts=hearts.filter(h=>h.a>0);for(const h of hearts){h.y+=h.vy*DPR;h.a-=.012;
  ctx.font=(h.s*DPR)+'px system-ui';ctx.fillStyle='rgba(244,114,182,'+h.a+')';ctx.fillText('❤',h.x,h.y)}
 ctx.restore();
 if(!AR){const sy=(t*140*DPR)%(H+200)-100;
  const sg=ctx.createLinearGradient(0,sy-40,0,sy+40);
  sg.addColorStop(0,'rgba(120,220,255,0)');sg.addColorStop(.5,'rgba(120,220,255,.06)');sg.addColorStop(1,'rgba(120,220,255,0)');
  ctx.fillStyle=sg;ctx.fillRect(0,sy-40,W,80)}
 requestAnimationFrame(loop)}
loop();
