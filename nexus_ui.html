<!DOCTYPE html>
<html>
<head>
    <title>NEXUS OMNI v9.0</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { margin:0; background:#000; color:#0f0; font-family:'Courier New'; overflow:hidden; }
        #map { height:100vh; width:100%; z-index:1; }
        #overlay { position:absolute; top:10px; left:10px; z-index:1000; background:rgba(0,20,0,0.8); padding:15px; border:1px solid #0f0; width:300px; }
        .stat { margin-bottom:5px; font-size:0.9rem; }
        .critical { color:#f00; font-weight:bold; }
        button { background:#0f0; color:#000; border:none; padding:5px 10px; cursor:pointer; width:100%; margin-top:5px; font-weight:bold; }
        canvas { position:absolute; top:0; left:0; pointer-events:none; z-index:500; }
    </style>
</head>
<body>
<div id="overlay">
    <h3>NEXUS OMNI v9.0</h3>
    <div class="stat">Estado: <span id="status">IDLE</span></div>
    <div class="stat">Modo: <span id="mode">STEALTH</span></div>
    <div class="stat critical">Amenazas: <span id="crit-count">0</span></div>
    <button onclick="startScan()">INICIAR ESCANEO COGNITIVO</button>
</div>
<div id="map"></div>
<canvas id="vector-canvas"></canvas>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', {zoomControl:false}).setView([4.7110, -74.0721], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {subdomains:'abcd'}).addTo(map);
    
    let markers = {};
    let ws = new WebSocket(`ws://${location.host}/ws`);
    
    ws.onmessage = (evt) => {
        const data = JSON.parse(evt.data);
        document.getElementById('status').innerText = data.stats.scanning ? "SCANNING..." : "MONITORING";
        document.getElementById('mode').innerText = data.stats.mode.toUpperCase();
        document.getElementById('crit-count').innerText = data.stats.critical;
        
        // Actualizar marcadores
        data.devices.forEach(d => {
            if(!markers[d.id]) {
                let color = d.threat_level === 'CRITICAL' ? '#f00' : (d.threat_level === 'HIGH' ? '#fa0' : '#0f0');
                let icon = L.divIcon({html:`<div style='background:${color};width:10px;height:10px;border-radius:50%;box-shadow:0 0 5px ${color};'></div>`, className:'custom', iconSize:[10,10]});
                markers[d.id] = L.marker([d.lat, d.lon], {icon:icon}).addTo(map).bindPopup(`<b>${d.ip}</b><br>Riesgo: ${d.risk_score}%<br>${d.threat_level}`);
            }
        });
        
        drawVectors(data.vectors);
    };

    function drawVectors(vectors) {
        const canvas = document.getElementById('vector-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        ctx.clearRect(0,0,canvas.width, canvas.height);
        
        vectors.forEach(v => {
            const p1 = map.latLngToContainerPoint([v.source, v.target]); // Simplificado para demo
            // En producción usar proyección real Mercator
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 0, 0, ${v.risk/100})`;
            ctx.lineWidth = 2;
            // Dibujar línea desde centro del mapa hacia el punto (simulación visual)
            const center = map.latLngToContainerPoint(map.getCenter());
            const point = map.latLngToContainerPoint([v.source, v.target]); // Ajustar coords reales
            // Nota: Para vectores reales se necesita proyector complejo, aquí simulamos efecto
            ctx.moveTo(center.x, center.y);
            ctx.lineTo(point.x, point.y);
            ctx.stroke();
        });
    }

    function startScan() {
        fetch('/api/scan', {method:'POST'}).then(()=>alert("Escaneo Cognitivo Iniciado"));
    }
</script>
</body>
</html>
